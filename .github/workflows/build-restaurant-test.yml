name: Build Geek POS Restaurant Test R2

on:
  push:
    branches: [ restaurant-mode-v209-test ]
    paths:
      - ".github/workflows/build-restaurant-test.yml"
      - "restaurant-build/**"
      - "r2-overlay/**"
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 40
    steps:
      - name: Checkout restaurant test branch
        uses: actions/checkout@v4

      - name: Download verified Geek POS v2.0.9 source
        uses: actions/download-artifact@v4
        with:
          name: GeekPOS-Source-v2.0.9
          path: source
          github-token: ${{ github.token }}
          repository: geekcand/pos
          run-id: 36806628910

      - name: Apply Restaurant Test base overlay
        shell: pwsh
        run: |
          $parts = Get-ChildItem "$env:GITHUB_WORKSPACE\restaurant-build\full.part*" | Sort-Object Name
          if ($parts.Count -ne 7) { throw "Expected 7 Restaurant Test base chunks, found $($parts.Count)." }
          $b64 = ($parts | ForEach-Object { (Get-Content $_.FullName -Raw).Trim() }) -join ''
          $bytes = [Convert]::FromBase64String($b64)
          $zip = Join-Path $env:GITHUB_WORKSPACE 'restaurant-base-overlay.zip'
          [IO.File]::WriteAllBytes($zip, $bytes)
          $hash = (Get-FileHash $zip -Algorithm SHA256).Hash.ToLowerInvariant()
          if ($hash -ne 'fb36227969b8b337e14bc7ebf9be0eb1dd4823b3841835118f4c511a34e6b323') { throw "Restaurant base overlay hash mismatch: $hash" }
          & tar.exe -xf $zip -C "$env:GITHUB_WORKSPACE\source"
          if ($LASTEXITCODE -ne 0) { throw 'Restaurant base overlay extraction failed.' }

      - name: Apply base WinUI compatibility fix
        shell: pwsh
        run: |
          $file = "$env:GITHUB_WORKSPACE\source\Pages\SettingsPage.xaml"
          $text = Get-Content $file -Raw
          $text = $text.Replace('<Separator/>','<Border Height="1" Background="#22000000" Margin="0,4"/>')
          Set-Content -Path $file -Value $text -Encoding utf8

      - name: Apply Restaurant R2 overlay
        shell: pwsh
        run: |
          $parts = Get-ChildItem "$env:GITHUB_WORKSPACE\r2-overlay\part*" | Sort-Object Name
          if ($parts.Count -ne 14) { throw "Expected 14 Restaurant R2 chunks, found $($parts.Count)." }
          $b64 = ($parts | ForEach-Object { (Get-Content $_.FullName -Raw).Trim() }) -join ''
          $bytes = [Convert]::FromBase64String($b64)
          $zip = Join-Path $env:GITHUB_WORKSPACE 'restaurant-r2-overlay.zip'
          [IO.File]::WriteAllBytes($zip, $bytes)
          $hash = (Get-FileHash $zip -Algorithm SHA256).Hash.ToLowerInvariant()
          Write-Host "Restaurant R2 overlay SHA256: $hash"
          if ($hash -ne '36373f782f1d6daa882bf648d878711e468241faff775a40aec58b716731f33c') { throw "Restaurant R2 overlay hash mismatch: $hash" }
          & tar.exe -xf $zip -C "$env:GITHUB_WORKSPACE\source"
          if ($LASTEXITCODE -ne 0) { throw 'Restaurant R2 overlay extraction failed.' }

      - name: Apply Restaurant R2 compile compatibility fix
        shell: pwsh
        run: |
          $file = "$env:GITHUB_WORKSPACE\source\Data\AppDbContext.cs"
          $text = Get-Content $file -Raw
          $text = $text -replace '(?m)^\s*modelBuilder\.Entity<RestaurantOrder>\(\)\.Property\(x => x\.DiscountAmount\)\.HasConversion<double>\(\);\r?\n?', ''
          Set-Content -Path $file -Value $text -Encoding utf8
          $posFile = "$env:GITHUB_WORKSPACE\source\Pages\PosPage.xaml.cs"
          $pos = Get-Content $posFile -Raw
          if ($pos -notmatch 'DispatchDelivery_Click') {
            $method = @'
    private async void DispatchDelivery_Click(object sender, RoutedEventArgs e)
    {
        try
        {
            if (_restaurantOrder is null || _restaurantOrder.OrderType != RestaurantOrderType.Delivery) return;
            await PersistRestaurantCartAsync();
            _couriers = await App.Services.Restaurant.GetCouriersAsync();
            var order = await App.Services.Restaurant.GetOrderAsync(_restaurantOrder.Id);
            if (order is null) throw new InvalidOperationException("تعذر تحميل طلب الدليفري.");
            await AssignCourierAndPrintAsync(order);
            var latest = await App.Services.Restaurant.GetOrderAsync(order.Id);
            if (latest?.Status == RestaurantOrderStatus.OutForDelivery)
            {
                _restaurantOrder = null; _cart.Clear(); RefreshCart(); SetMode(RestaurantOrderType.Takeaway);
            }
        }
        catch (Exception ex) { await PageHelpers.MessageAsync(XamlRoot, "الدليفري", ex.Message); }
    }

'@
            $pos = $pos.Replace('    private async void DiningTab_Click', $method + '    private async void DiningTab_Click')
            Set-Content -Path $posFile -Value $pos -Encoding utf8
          }

      - name: Verify Restaurant R2 source
        shell: pwsh
        run: |
          $root = "$env:GITHUB_WORKSPACE\source"
          $required = @(
            'Services\RestaurantService.cs',
            'Services\ReceiptService.cs',
            'Pages\PosPage.xaml',
            'Pages\PosPage.xaml.cs',
            'Pages\SettingsPage.xaml',
            'Pages\SettingsPage.xaml.cs',
            'Pages\ShellPage.xaml',
            'Pages\ShellPage.xaml.cs',
            'Data\DatabaseService.cs',
            'Core\Entities.cs',
            'Core\Enums.cs',
            'Models\Dtos.cs'
          )
          foreach ($f in $required) { if (!(Test-Path (Join-Path $root $f))) { throw "Missing R2 file: $f" } }

          $shell = Get-Content "$root\Pages\ShellPage.xaml" -Raw
          $shellCode = Get-Content "$root\Pages\ShellPage.xaml.cs" -Raw
          $posCode = Get-Content "$root\Pages\PosPage.xaml.cs" -Raw
          $svc = Get-Content "$root\Services\RestaurantService.cs" -Raw
          $receipt = Get-Content "$root\Services\ReceiptService.cs" -Raw
          $settings = Get-Content "$root\Pages\SettingsPage.xaml" -Raw
          $settingsCode = Get-Content "$root\Pages\SettingsPage.xaml.cs" -Raw
          $db = Get-Content "$root\Data\DatabaseService.cs" -Raw
          $enums = Get-Content "$root\Core\Enums.cs" -Raw

          if ($shell -match 'RestaurantSettingsNav' -or $shellCode -match 'RestaurantSettingsNav') { throw 'Separate Restaurant Settings navigation still exists.' }
          if ($settings -notmatch 'CouriersPanel') { throw 'Courier settings missing.' }
          if ($settings -notmatch 'TestKitchenPrint_Click') { throw 'Kitchen printer test button missing.' }
          if ($settings -notmatch 'الصالات والترابيزات') { throw 'Dining areas settings missing.' }
          if ($settingsCode -notmatch 'صالة') { throw 'Automatic hall numbering missing.' }
          if ($settingsCode -notmatch 'RestaurantCouriersJson') { throw 'Courier settings persistence missing.' }
          if ($posCode -notmatch 'AssignCourierAndPrintAsync') { throw 'Courier assignment and print flow missing.' }
          if ($posCode -notmatch 'SettleCourierAsync') { throw 'Courier settlement flow missing.' }
          if ($posCode -notmatch 'ترابيزة') { throw 'Arabic pre-numbered table labels missing.' }
          if ($svc -notmatch 'AssignCourierAsync' -or $svc -notmatch 'GetCourierOutstandingAsync') { throw 'Courier service flow incomplete.' }
          if ($receipt -notmatch 'PrintDeliveryOrderAsync' -or $receipt -notmatch 'PrintCourierManifestAsync') { throw 'Delivery order/manifest printing missing.' }
          if ($receipt -notmatch 'PrintKitchenTestAsync') { throw 'Kitchen print test missing.' }
          if ($db -notmatch 'CourierId' -or $db -notmatch 'DispatchedAt' -or $db -notmatch 'SettledAt') { throw 'Courier database upgrade missing.' }
          if ($db -notmatch 'RestaurantCouriersJson') { throw 'Courier settings seed missing.' }
          if ($enums -notmatch 'OutForDelivery') { throw 'OutForDelivery status missing.' }

      - name: Verify stable version and licensing
        shell: pwsh
        run: |
          $root = "$env:GITHUB_WORKSPACE\source"
          $project = Get-Content "$root\SweetsPOS.csproj" -Raw
          $installer = Get-Content "$root\installer.iss" -Raw
          if ($project -notmatch '<Version>2\.0\.9</Version>') { throw 'Base app version changed.' }
          if ($installer -notmatch 'MyAppVersion "2\.0\.9"') { throw 'Installer version changed.' }
          $out = Join-Path $env:GITHUB_WORKSPACE 'activation-diagnostic.txt'
          & "$root\InstallerTools\GeekPOS-Activate.ps1" -Serial "GEEK-TEST-INVALID-0000" -OutFile $out
          $result = (Get-Content $out -Raw).Trim()
          if ($result -ne 'ERR|REJECTED') { throw "Licensing helper changed unexpectedly: $result" }

      - name: Setup .NET 10 SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.401'

      - name: Install Inno Setup 6
        shell: pwsh
        run: choco install innosetup -y --no-progress

      - name: Build setup
        shell: pwsh
        working-directory: source
        run: |
          Set-ExecutionPolicy -Scope Process Bypass -Force
          .\build.ps1

      - name: Stage Restaurant R2 setup
        shell: pwsh
        run: |
          $src = "$env:GITHUB_WORKSPACE\source\artifacts\installer-fixed\GeekPOS-Setup-x64-v2.0.9.exe"
          if (!(Test-Path $src)) { throw 'Setup missing.' }
          $dst = "$env:GITHUB_WORKSPACE\GeekPOS-Setup-x64-v2.0.9-Restaurant-Test-R2.exe"
          Copy-Item $src $dst -Force
          Write-Host "Setup SHA256: $((Get-FileHash $dst -Algorithm SHA256).Hash)"

      - name: Upload setup
        uses: actions/upload-artifact@v4
        with:
          name: GeekPOS-Setup-x64-v2.0.9-Restaurant-Test-R2
          path: GeekPOS-Setup-x64-v2.0.9-Restaurant-Test-R2.exe
          if-no-files-found: error
          compression-level: 0
          retention-days: 14

      - name: Upload source
        uses: actions/upload-artifact@v4
        with:
          name: GeekPOS-Source-v2.0.9-Restaurant-Test-R2
          path: |
            source/**
            !source/artifacts/**
            !source/bin/**
            !source/obj/**
          if-no-files-found: error
          retention-days: 14
