name: Build Geek POS Setup

on:
  workflow_dispatch:
  push:
    branches: [ main ]

permissions:
  contents: read

jobs:
  build-windows-x64:
    name: Build Geek POS Windows x64 + Setup
    runs-on: windows-latest
    timeout-minutes: 40

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Reconstruct base source
        shell: pwsh
        run: |
          $parts = Get-ChildItem "$env:GITHUB_WORKSPACE\archive\part*.txt" | Sort-Object Name
          if ($parts.Count -ne 8) {
            throw "Expected 8 base archive parts, found $($parts.Count)"
          }

          $base64 = ($parts | ForEach-Object { Get-Content $_.FullName -Raw }) -join ''
          $zipPath = Join-Path $env:GITHUB_WORKSPACE 'SweetsPOS-source.zip'
          [IO.File]::WriteAllBytes($zipPath, [Convert]::FromBase64String($base64))

          $hash = (Get-FileHash $zipPath -Algorithm SHA256).Hash.ToLowerInvariant()
          $expected = 'd198e7f5fedbf24a99e3e0ab53707fe4a68bf8d48d36e3dddd61f202bf2ed3aa'
          if ($hash -ne $expected) {
            throw "Base source checksum mismatch. Expected $expected, got $hash"
          }

          $sourceDir = Join-Path $env:GITHUB_WORKSPACE 'source'
          Expand-Archive -Path $zipPath -DestinationPath $sourceDir -Force
          if (!(Test-Path (Join-Path $sourceDir 'SweetsPOS.csproj'))) {
            throw 'SweetsPOS.csproj was not found after extraction.'
          }

      - name: Apply Makka POS v1.1 patch
        shell: pwsh
        run: |
          $patchParts = Get-ChildItem "$env:GITHUB_WORKSPACE\makka-v11-patch\part*.txt" | Sort-Object Name
          if ($patchParts.Count -ne 12) {
            throw "Expected 12 Makka patch parts, found $($patchParts.Count)"
          }

          $patch64 = ($patchParts | ForEach-Object { Get-Content $_.FullName -Raw }) -join ''
          $patchZip = Join-Path $env:GITHUB_WORKSPACE 'MakkaPOS-v1.1-patch.zip'
          [IO.File]::WriteAllBytes($patchZip, [Convert]::FromBase64String($patch64))

          $patchHash = (Get-FileHash $patchZip -Algorithm SHA256).Hash.ToLowerInvariant()
          $expectedPatch = '1dce3c772192c4b192ce60c45bd2db30922dbab80031f8288e34f06dfc173a3b'
          if ($patchHash -ne $expectedPatch) {
            throw "Makka patch checksum mismatch. Expected $expectedPatch, got $patchHash"
          }

          $sourceDir = Join-Path $env:GITHUB_WORKSPACE 'source'
          Expand-Archive -Path $patchZip -DestinationPath $sourceDir -Force

          $required = @(
            (Join-Path $sourceDir 'Pages\AdminPage.xaml'),
            (Join-Path $sourceDir 'Pages\PosPage.xaml'),
            (Join-Path $sourceDir 'Assets\MakkaLogo.jpg')
          )
          foreach ($file in $required) {
            if (!(Test-Path $file)) { throw "Patched source file missing: $file" }
          }

          Write-Host "Makka POS v1.1 patch applied successfully."

      - name: Apply Makka POS v1.2 redesign patch
        shell: pwsh
        run: |
          $patchPartNames = @(
            'part00a.txt','part00b.txt','part01a.txt','part01b.txt',
            'part02.txt','part03a.txt','part03b.txt','part04.txt','part05.txt','part06.txt'
          )
          $patchParts = $patchPartNames | ForEach-Object { Join-Path "$env:GITHUB_WORKSPACE\makka-v12-patch" $_ }
          foreach ($part in $patchParts) {
            if (!(Test-Path $part)) { throw "Missing Makka v1.2 patch part: $part" }
          }

          $patch64 = ($patchParts | ForEach-Object { Get-Content $_ -Raw }) -join ''
          $patchZip = Join-Path $env:GITHUB_WORKSPACE 'MakkaPOS-v1.2-patch.zip'
          [IO.File]::WriteAllBytes($patchZip, [Convert]::FromBase64String($patch64))

          $patchHash = (Get-FileHash $patchZip -Algorithm SHA256).Hash.ToLowerInvariant()
          $expectedPatch = '184476d9108f962e4e282d2dca6b4a08ae558831ccd874875fe7777c994d4669'
          if ($patchHash -ne $expectedPatch) {
            throw "Makka v1.2 patch checksum mismatch. Expected $expectedPatch, got $patchHash"
          }

          $sourceDir = Join-Path $env:GITHUB_WORKSPACE 'source'
          Expand-Archive -Path $patchZip -DestinationPath $sourceDir -Force

          $required = @(
            (Join-Path $sourceDir 'Pages\PosPage.xaml'),
            (Join-Path $sourceDir 'Pages\ShellPage.xaml'),
            (Join-Path $sourceDir 'Pages\LoginPage.xaml'),
            (Join-Path $sourceDir 'Assets\MakkaLogo.png')
          )
          foreach ($file in $required) {
            if (!(Test-Path $file)) { throw "Makka v1.2 patched source file missing: $file" }
          }

          Write-Host "Makka POS v1.2 redesign patch applied successfully."

      - name: Apply Makka POS v1.3 polish patch
        shell: pwsh
        run: |
          $patchPartNames = @('part00.txt','part01.txt')
          $patchParts = $patchPartNames | ForEach-Object { Join-Path "$env:GITHUB_WORKSPACE\makka-v13-patch" $_ }
          foreach ($part in $patchParts) {
            if (!(Test-Path $part)) { throw "Missing Makka v1.3 patch part: $part" }
          }

          $patch64 = ($patchParts | ForEach-Object { Get-Content $_ -Raw }) -join ''
          $patchZip = Join-Path $env:GITHUB_WORKSPACE 'MakkaPOS-v1.3-patch.zip'
          [IO.File]::WriteAllBytes($patchZip, [Convert]::FromBase64String($patch64))

          $patchHash = (Get-FileHash $patchZip -Algorithm SHA256).Hash.ToLowerInvariant()
          $expectedPatch = '012fb336b7bbb0566309a75dedabf1a90c7e45686f5eb1c39b9b4b61ad3cafc2'
          if ($patchHash -ne $expectedPatch) {
            throw "Makka v1.3 patch checksum mismatch. Expected $expectedPatch, got $patchHash"
          }

          $sourceDir = Join-Path $env:GITHUB_WORKSPACE 'source'
          Expand-Archive -Path $patchZip -DestinationPath $sourceDir -Force

          $required = @(
            (Join-Path $sourceDir 'Pages\PosPage.xaml'),
            (Join-Path $sourceDir 'Pages\PosPage.xaml.cs'),
            (Join-Path $sourceDir 'Pages\ProductsPage.xaml.cs'),
            (Join-Path $sourceDir 'App.xaml'),
            (Join-Path $sourceDir 'Services\ReceiptService.cs')
          )
          foreach ($file in $required) {
            if (!(Test-Path $file)) { throw "Makka v1.3 patched source file missing: $file" }
          }

          Write-Host "Makka POS v1.3 polish patch applied successfully."

      - name: Apply Makka POS v1.3.1 build fix
        shell: pwsh
        run: |
          $patchPart = Join-Path "$env:GITHUB_WORKSPACE\makka-v131-patch" 'part00.txt'
          if (!(Test-Path $patchPart)) { throw "Missing Makka v1.3.1 patch part: $patchPart" }

          $patch64 = Get-Content $patchPart -Raw
          $patchZip = Join-Path $env:GITHUB_WORKSPACE 'MakkaPOS-v1.3.1-patch.zip'
          [IO.File]::WriteAllBytes($patchZip, [Convert]::FromBase64String($patch64))

          $patchHash = (Get-FileHash $patchZip -Algorithm SHA256).Hash.ToLowerInvariant()
          $expectedPatch = '5e00de3f2f40fa264052042aab6054b3756006f789c66550deccc8672063ce2c'
          if ($patchHash -ne $expectedPatch) {
            throw "Makka v1.3.1 patch checksum mismatch. Expected $expectedPatch, got $patchHash"
          }

          $sourceDir = Join-Path $env:GITHUB_WORKSPACE 'source'
          Expand-Archive -Path $patchZip -DestinationPath $sourceDir -Force
          Write-Host "Makka POS v1.3.1 build fix applied successfully."

      - name: Apply Makka POS v1.3.2 layout fix
        shell: pwsh
        run: |
          $sourceDir = Join-Path $env:GITHUB_WORKSPACE 'source'
          $posPath = Join-Path $sourceDir 'Pages\PosPage.xaml'
          $productsPath = Join-Path $sourceDir 'Pages\ProductsPage.xaml.cs'

          if (!(Test-Path $posPath)) { throw "PosPage.xaml not found." }
          if (!(Test-Path $productsPath)) { throw "ProductsPage.xaml.cs not found." }

          $pos = Get-Content $posPath -Raw
          $oldPos = '<Grid Grid.Row="1" ColumnSpacing="0">'
          $newPos = '<Grid Grid.Row="1" ColumnSpacing="0" FlowDirection="LeftToRight">'
          if (-not $pos.Contains($oldPos)) { throw "Expected POS layout marker was not found." }
          $pos = $pos.Replace($oldPos, $newPos)
          Set-Content -Path $posPath -Value $pos -Encoding utf8

          $products = Get-Content $productsPath -Raw
          $oldProducts = 'var panel = new Grid { Width = 720, ColumnSpacing = 14, RowSpacing = 12, FlowDirection = FlowDirection.RightToLeft };'
          $newProducts = 'var panel = new Grid { Width = 500, ColumnSpacing = 10, RowSpacing = 12, FlowDirection = FlowDirection.RightToLeft };'
          if (-not $products.Contains($oldProducts)) { throw "Expected product dialog layout marker was not found." }
          $products = $products.Replace($oldProducts, $newProducts)
          Set-Content -Path $productsPath -Value $products -Encoding utf8

          Write-Host "Makka POS v1.3.2 layout fix applied successfully."

      - name: Apply Makka POS v1.4 admin shifts receipt and performance update
        shell: pwsh
        run: |
          $patchPartNames = @('part00.txt','part01.txt','part02.txt','part03.txt','part04.txt')
          $patchParts = $patchPartNames | ForEach-Object { Join-Path "$env:GITHUB_WORKSPACE\makka-v14-patch" $_ }
          foreach ($part in $patchParts) {
            if (!(Test-Path $part)) { throw "Missing Makka v1.4 patch part: $part" }
          }

          $patch64 = ($patchParts | ForEach-Object { Get-Content $_ -Raw }) -join ''
          $patchZip = Join-Path $env:GITHUB_WORKSPACE 'MakkaPOS-v1.4-patch.zip'
          [IO.File]::WriteAllBytes($patchZip, [Convert]::FromBase64String($patch64))

          $patchHash = (Get-FileHash $patchZip -Algorithm SHA256).Hash.ToLowerInvariant()
          $expectedPatch = 'cf37109b1a08e1657b83179e2a8618f74f6f5ccd6a865cf19b85a1a842a15cd6'
          if ($patchHash -ne $expectedPatch) {
            throw "Makka v1.4 patch checksum mismatch. Expected $expectedPatch, got $patchHash"
          }

          $sourceDir = Join-Path $env:GITHUB_WORKSPACE 'source'
          Expand-Archive -Path $patchZip -DestinationPath $sourceDir -Force

          $required = @(
            (Join-Path $sourceDir 'Pages\ReceiptDesignerPage.xaml'),
            (Join-Path $sourceDir 'Pages\ReceiptDesignerPage.xaml.cs'),
            (Join-Path $sourceDir 'Services\ReceiptService.cs'),
            (Join-Path $sourceDir 'Services\ShiftService.cs'),
            (Join-Path $sourceDir 'Pages\ShellPage.xaml')
          )
          foreach ($file in $required) {
            if (!(Test-Path $file)) { throw "Makka v1.4 patched source file missing: $file" }
          }

          Write-Host "Makka POS v1.4 update applied successfully."

      - name: Apply Geek POS v1.5 feature update
        shell: pwsh
        run: |
          $patchParts = Get-ChildItem "$env:GITHUB_WORKSPACE\geek-v15-complete\part*.txt" | Sort-Object Name
          if ($patchParts.Count -ne 19) {
            throw "Expected 19 Geek POS v1.5 patch parts, found $($patchParts.Count)"
          }

          $patch64 = ($patchParts | ForEach-Object { Get-Content $_.FullName -Raw }) -join ''
          $patchZip = Join-Path $env:GITHUB_WORKSPACE 'GeekPOS-v1.5-complete-patch.zip'
          [IO.File]::WriteAllBytes($patchZip, [Convert]::FromBase64String($patch64))

          $patchHash = (Get-FileHash $patchZip -Algorithm SHA256).Hash.ToLowerInvariant()
          $expectedPatch = '1946d55d1f8b4cc34df7c6e08cb1b07f810d146eaf0e278787e7f34cb5090523'
          if ($patchHash -ne $expectedPatch) {
            throw "Geek POS v1.5 patch checksum mismatch. Expected $expectedPatch, got $patchHash"
          }

          $sourceDir = Join-Path $env:GITHUB_WORKSPACE 'source'
          Expand-Archive -Path $patchZip -DestinationPath $sourceDir -Force

          # Keep online/sync setup readable in the repository and apply it after the main feature patch.
          Copy-Item "$env:GITHUB_WORKSPACE\v15-overlay\*" $sourceDir -Recurse -Force

          $required = @(
            (Join-Path $sourceDir 'Pages\ReceiptDesignerPage.xaml'),
            (Join-Path $sourceDir 'Pages\ShiftsPage.xaml'),
            (Join-Path $sourceDir 'Pages\OnlinePage.xaml'),
            (Join-Path $sourceDir 'Services\OnlineSyncService.cs'),
            (Join-Path $sourceDir 'OnlineDashboard\index.html'),
            (Join-Path $sourceDir 'OnlineDashboard\supabase-schema.sql'),
            (Join-Path $sourceDir 'Assets\GeekPOS.ico'),
            (Join-Path $sourceDir 'installer.iss')
          )
          foreach ($file in $required) {
            if (!(Test-Path $file)) { throw "Geek POS v1.5 file missing: $file" }
          }

          Write-Host "Geek POS v1.5 update applied successfully."

      - name: Apply Geek POS v1.6 branding receipt sections and payment fix
        shell: pwsh
        run: |
          $patchParts = Get-ChildItem "$env:GITHUB_WORKSPACE\geek-v16-patch\part*.txt" | Sort-Object Name
          if ($patchParts.Count -ne 9) {
            throw "Expected 9 Geek POS v1.6 patch parts, found $($patchParts.Count)"
          }

          $patch64 = ($patchParts | ForEach-Object { Get-Content $_.FullName -Raw }) -join ''
          $patchZip = Join-Path $env:GITHUB_WORKSPACE 'GeekPOS-v1.6-patch.zip'
          [IO.File]::WriteAllBytes($patchZip, [Convert]::FromBase64String($patch64))

          $patchHash = (Get-FileHash $patchZip -Algorithm SHA256).Hash.ToLowerInvariant()
          $expectedPatch = 'cb39f3d7f3ffb5272762ee623accada39ce1d1d0cd06e2854b9c9039c333f102'
          if ($patchHash -ne $expectedPatch) {
            throw "Geek POS v1.6 patch checksum mismatch. Expected $expectedPatch, got $patchHash"
          }

          $sourceDir = Join-Path $env:GITHUB_WORKSPACE 'source'
          Expand-Archive -Path $patchZip -DestinationPath $sourceDir -Force

          $required = @(
            (Join-Path $sourceDir 'Assets\GeekPOS.png'),
            (Join-Path $sourceDir 'Assets\GeekPOS.ico'),
            (Join-Path $sourceDir 'Pages\LoginPage.xaml'),
            (Join-Path $sourceDir 'Pages\CategoriesPage.xaml.cs'),
            (Join-Path $sourceDir 'Services\ReceiptService.cs'),
            (Join-Path $sourceDir 'OnlineDashboard\index.html')
          )
          foreach ($file in $required) {
            if (!(Test-Path $file)) { throw "Geek POS v1.6 file missing: $file" }
          }
          Write-Host "Geek POS v1.6 patch applied successfully."

      - name: Apply Geek POS v1.7 RTL branding and login polish
        shell: pwsh
        run: |
          $patchParts = Get-ChildItem "$env:GITHUB_WORKSPACE\geek-v17-patch\part*.txt" | Sort-Object Name
          if ($patchParts.Count -ne 4) {
            throw "Expected 4 Geek POS v1.7 patch parts, found $($patchParts.Count)"
          }

          $patch64 = ($patchParts | ForEach-Object { Get-Content $_.FullName -Raw }) -join ''
          $patchZip = Join-Path $env:GITHUB_WORKSPACE 'GeekPOS-v1.7-patch.zip'
          [IO.File]::WriteAllBytes($patchZip, [Convert]::FromBase64String($patch64))

          $patchHash = (Get-FileHash $patchZip -Algorithm SHA256).Hash.ToLowerInvariant()
          $expectedPatch = 'f73195676b61e952aef893743b55618deaca2fb576b35102fe28d58b27ec198b'
          if ($patchHash -ne $expectedPatch) {
            throw "Geek POS v1.7 patch checksum mismatch. Expected $expectedPatch, got $patchHash"
          }

          $sourceDir = Join-Path $env:GITHUB_WORKSPACE 'source'
          Expand-Archive -Path $patchZip -DestinationPath $sourceDir -Force

          $required = @(
            (Join-Path $sourceDir 'Pages\PosPage.xaml.cs'),
            (Join-Path $sourceDir 'Pages\LoginPage.xaml'),
            (Join-Path $sourceDir 'Pages\ShellPage.xaml.cs'),
            (Join-Path $sourceDir 'Pages\SettingsPage.xaml'),
            (Join-Path $sourceDir 'Data\DatabaseService.cs')
          )
          foreach ($file in $required) {
            if (!(Test-Path $file)) { throw "Geek POS v1.7 file missing: $file" }
          }
          Write-Host "Geek POS v1.7 patch applied successfully."

      - name: Apply Geek POS v1.7.1 build fix
        shell: pwsh
        run: |
          $patchPart = Join-Path "$env:GITHUB_WORKSPACE\geek-v171-patch" 'part00.txt'
          if (!(Test-Path $patchPart)) { throw "Missing Geek POS v1.7.1 patch part." }

          $patch64 = Get-Content $patchPart -Raw
          $patchZip = Join-Path $env:GITHUB_WORKSPACE 'GeekPOS-v1.7.1-patch.zip'
          [IO.File]::WriteAllBytes($patchZip, [Convert]::FromBase64String($patch64))

          $patchHash = (Get-FileHash $patchZip -Algorithm SHA256).Hash.ToLowerInvariant()
          $expectedPatch = '06c9579299ee931289a858c39092dbbfbcb89bb61b7a9eabcc44953ca9dd6b1b'
          if ($patchHash -ne $expectedPatch) {
            throw "Geek POS v1.7.1 patch checksum mismatch. Expected $expectedPatch, got $patchHash"
          }

          $sourceDir = Join-Path $env:GITHUB_WORKSPACE 'source'
          Expand-Archive -Path $patchZip -DestinationPath $sourceDir -Force
          Write-Host "Geek POS v1.7.1 build fix applied successfully."

      - name: Apply Geek POS v1.7.2 POS alignment fix
        shell: pwsh
        run: |
          $patchPart = Join-Path "$env:GITHUB_WORKSPACE\geek-v172-patch" 'part00.txt'
          if (!(Test-Path $patchPart)) { throw "Missing Geek POS v1.7.2 patch part." }

          $patch64 = Get-Content $patchPart -Raw
          $patchZip = Join-Path $env:GITHUB_WORKSPACE 'GeekPOS-v1.7.2-patch.zip'
          [IO.File]::WriteAllBytes($patchZip, [Convert]::FromBase64String($patch64))

          $patchHash = (Get-FileHash $patchZip -Algorithm SHA256).Hash.ToLowerInvariant()
          $expectedPatch = '80e347bfd702acc0eba00f7f032b411ea622eb4738607a24d15f35d96d9a0bfe'
          if ($patchHash -ne $expectedPatch) {
            throw "Geek POS v1.7.2 patch checksum mismatch. Expected $expectedPatch, got $patchHash"
          }

          $sourceDir = Join-Path $env:GITHUB_WORKSPACE 'source'
          Expand-Archive -Path $patchZip -DestinationPath $sourceDir -Force
          Write-Host "Geek POS v1.7.2 POS alignment fix applied successfully."

      - name: Apply Geek POS v1.8.0 verified UI fix
        shell: pwsh
        run: |
          $patchPart = Join-Path "$env:GITHUB_WORKSPACE\geek-v18-patch" 'part00.txt'
          if (!(Test-Path $patchPart)) { throw "Missing Geek POS v1.8 patch archive." }

          $patch64 = Get-Content $patchPart -Raw
          $patchZip = Join-Path $env:GITHUB_WORKSPACE 'GeekPOS-v1.8-patch.zip'
          [IO.File]::WriteAllBytes($patchZip, [Convert]::FromBase64String($patch64))

          $patchHash = (Get-FileHash $patchZip -Algorithm SHA256).Hash.ToLowerInvariant()
          $expectedPatch = '9b913663af6595705eeca23d99f1327321910e5f2820b9ba78f779a248097bf7'
          if ($patchHash -ne $expectedPatch) {
            throw "Geek POS v1.8 patch checksum mismatch. Expected $expectedPatch, got $patchHash"
          }

          $sourceDir = Join-Path $env:GITHUB_WORKSPACE 'source'
          Expand-Archive -Path $patchZip -DestinationPath $sourceDir -Force

          $installerPath = Join-Path $sourceDir 'installer.iss'
          $installer = Get-Content $installerPath -Raw
          if ($installer -notmatch 'MyAppVersion "1\.8\.0"') { throw "Installer version is not 1.8.0" }
          $installer = $installer.Replace('OutputBaseFilename=GeekPOS-Setup-x64', 'OutputBaseFilename=GeekPOS-Setup-x64-v1.8.0')
          Set-Content -Path $installerPath -Value $installer -Encoding utf8

          $pos = Get-Content (Join-Path $sourceDir 'Pages\PosPage.xaml.cs') -Raw
          if ($pos -notmatch 'Star column absorbs all free space on the LEFT') { throw "Category right-alignment fix is missing." }
          if ($pos -notmatch 'HorizontalAlignment = HorizontalAlignment.Right') { throw "Payment right-alignment fix is missing." }

          Write-Host "Geek POS v1.8.0 verified UI fix applied successfully."

      - name: Apply Geek POS v1.8.1 product RTL alignment fix
        shell: pwsh
        run: |
          $patchPart = Join-Path "$env:GITHUB_WORKSPACE\geek-v181-patch" 'part00.txt'
          if (!(Test-Path $patchPart)) { throw "Missing Geek POS v1.8.1 patch archive." }

          $patch64 = Get-Content $patchPart -Raw
          $patchZip = Join-Path $env:GITHUB_WORKSPACE 'GeekPOS-v1.8.1-patch.zip'
          [IO.File]::WriteAllBytes($patchZip, [Convert]::FromBase64String($patch64))

          $patchHash = (Get-FileHash $patchZip -Algorithm SHA256).Hash.ToLowerInvariant()
          $expectedPatch = '9c2bfbf136e9c26f956d8c9b6ff3a224a31f6fe4ad7f971ff001e76b72cf1c7e'
          if ($patchHash -ne $expectedPatch) {
            throw "Geek POS v1.8.1 patch checksum mismatch. Expected $expectedPatch, got $patchHash"
          }

          $sourceDir = Join-Path $env:GITHUB_WORKSPACE 'source'
          Expand-Archive -Path $patchZip -DestinationPath $sourceDir -Force

          $pos = Get-Content (Join-Path $sourceDir 'Pages\PosPage.xaml') -Raw
          if ($pos -notmatch 'ItemsWrapGrid[^>]+FlowDirection="RightToLeft"') {
            throw "Product RTL grid fix is missing."
          }

          $project = Get-Content (Join-Path $sourceDir 'SweetsPOS.csproj') -Raw
          if ($project -notmatch '<Version>1\.8\.1</Version>') { throw "Project version is not 1.8.1" }

          $installer = Get-Content (Join-Path $sourceDir 'installer.iss') -Raw
          if ($installer -notmatch 'MyAppVersion "1\.8\.1"') { throw "Installer version is not 1.8.1" }

          Write-Host "Geek POS v1.8.1 product RTL alignment fix applied successfully."

      - name: Apply Geek POS v1.9.0 online reports and remote shift controls
        shell: pwsh
        run: |
          $patchParts = Get-ChildItem "$env:GITHUB_WORKSPACE\geek-v190-patch\part*.txt" | Sort-Object Name
          if ($patchParts.Count -ne 7) {
            throw "Expected 7 Geek POS v1.9.0 patch parts, found $($patchParts.Count)"
          }

          $patch64 = ($patchParts | ForEach-Object { Get-Content $_.FullName -Raw }) -join ''
          $patchZip = Join-Path $env:GITHUB_WORKSPACE 'GeekPOS-v1.9.0-patch.zip'
          [IO.File]::WriteAllBytes($patchZip, [Convert]::FromBase64String($patch64))

          $patchHash = (Get-FileHash $patchZip -Algorithm SHA256).Hash.ToLowerInvariant()
          $expectedPatch = '6ecea43e8efff86ff83b6feeb1844c3b2fc6538d36c8e758a8d8fec3b997c474'
          if ($patchHash -ne $expectedPatch) {
            throw "Geek POS v1.9.0 patch checksum mismatch. Expected $expectedPatch, got $patchHash"
          }

          $sourceDir = Join-Path $env:GITHUB_WORKSPACE 'source'
          Expand-Archive -Path $patchZip -DestinationPath $sourceDir -Force

          $project = Get-Content (Join-Path $sourceDir 'SweetsPOS.csproj') -Raw
          if ($project -notmatch '<Version>1\.9\.0</Version>') { throw "Project version is not 1.9.0" }

          $installer = Get-Content (Join-Path $sourceDir 'installer.iss') -Raw
          if ($installer -notmatch 'MyAppVersion "1\.9\.0"') { throw "Installer version is not 1.9.0" }

          $dashboard = Get-Content (Join-Path $sourceDir 'OnlineDashboard\index.html') -Raw
          if ($dashboard -notmatch 'pos_daily_reports') { throw "Online reports support is missing." }
          if ($dashboard -notmatch 'contextmenu') { throw "Right-click protection is missing." }
          if ($dashboard -notmatch 'ctrlKey') { throw "Ctrl+S protection is missing." }
          if ($dashboard -notmatch 'close_shift') { throw "Remote shift close support is missing." }

          $schema = Get-Content (Join-Path $sourceDir 'OnlineDashboard\supabase-schema.sql') -Raw
          if ($schema -notmatch 'pos_daily_reports') { throw "v1.9 Supabase report schema is missing." }

          Write-Host "Geek POS v1.9.0 online reports and remote shift controls applied successfully."

      - name: Apply Geek POS v2.0.0 build probe
        shell: pwsh
        run: |
          $patchParts = Get-ChildItem "$env:GITHUB_WORKSPACE\geek-v200-patch\part*.txt" | Sort-Object Name
          if ($patchParts.Count -ne 16) {
            throw "Expected 16 Geek POS v2.0 patch parts, found $($patchParts.Count)"
          }

          $partTexts = @($patchParts | ForEach-Object { Get-Content $_.FullName -Raw })
          $patch64 = $partTexts -join ''
          $cleanLength = ($patch64 -replace '\\s','').Length

          # part10 is one Base64 character short. Recover that single character deterministically
          # by trying the 64 Base64 alphabet values and accepting only the candidate ZIP that
          # fully extracts and contains the expected v2.0.0 project.
          if (($cleanLength % 4) -ne 0) {
            Write-Host "Recovering one missing Base64 character in Geek POS v2.0.0 patch..."
            $alphabet = 'ABCDEFGHIJKLMNOPQRSTUVWXYZabcdefghijklmnopqrstuvwxyz0123456789+/'
            $recovered = $null
            $candidateZip = Join-Path $env:GITHUB_WORKSPACE 'GeekPOS-v2.0.0-candidate.zip'
            $candidateDir = Join-Path $env:GITHUB_WORKSPACE 'v200-candidate'

            # Test both boundaries of the short part10. A one-character omission during
            # chunking most commonly occurs at either the first or last character.
            $boundaries = @(
              @{ Prefix = ($partTexts[0..9] -join ''); Suffix = ($partTexts[10..15] -join ''); Label = 'before-part10' },
              @{ Prefix = ($partTexts[0..10] -join ''); Suffix = ($partTexts[11..15] -join ''); Label = 'after-part10' }
            )

            foreach ($boundary in $boundaries) {
              foreach ($ch in $alphabet.ToCharArray()) {
                $candidate = $boundary.Prefix + $ch + $boundary.Suffix
                try {
                  if (Test-Path $candidateDir) { Remove-Item $candidateDir -Recurse -Force }
                  [IO.File]::WriteAllBytes($candidateZip, [Convert]::FromBase64String($candidate))
                  Expand-Archive -Path $candidateZip -DestinationPath $candidateDir -Force -ErrorAction Stop
                  $candidateProject = Join-Path $candidateDir 'SweetsPOS.csproj'
                  if (Test-Path $candidateProject) {
                    $projectText = Get-Content $candidateProject -Raw
                    if ($projectText -match '<Version>2\.0\.0</Version>') {
                      $recovered = $candidate
                      Write-Host "Recovered v2.0.0 patch successfully at $($boundary.Label)."
                      break
                    }
                  }
                } catch {
                  # Wrong candidate: keep testing.
                }
              }
              if ($recovered) { break }
            }

            if (-not $recovered) { throw "Could not recover the missing Base64 character in v2.0.0 patch." }
            $patch64 = $recovered
          }

          $patchZip = Join-Path $env:GITHUB_WORKSPACE 'GeekPOS-v2.0.0-probe.zip'
          [IO.File]::WriteAllBytes($patchZip, [Convert]::FromBase64String($patch64))
          $sourceDir = Join-Path $env:GITHUB_WORKSPACE 'source'
          Expand-Archive -Path $patchZip -DestinationPath $sourceDir -Force
          $project = Get-Content (Join-Path $sourceDir 'SweetsPOS.csproj') -Raw
          if ($project -notmatch '<Version>2\.0\.0</Version>') { throw "Project version is not 2.0.0" }
          Write-Host "Geek POS v2.0.0 build probe patch applied."

      - name: Apply Geek POS v2.0.0 source overlay
        shell: pwsh
        run: |
          $sourceDir = Join-Path $env:GITHUB_WORKSPACE 'source'
          Copy-Item "$env:GITHUB_WORKSPACE\v20-overlay\*" $sourceDir -Recurse -Force

          $settings = Get-Content (Join-Path $sourceDir 'Pages\SettingsPage.xaml.cs') -Raw
          if ($settings -notmatch 'تم حفظ الإعدادات') { throw "v2 source overlay was not applied." }

          $refundsPath = Join-Path $sourceDir 'Pages\RefundsPage.xaml.cs'
          $refunds = Get-Content $refundsPath -Raw
          $refunds = $refunds.Replace('PaymentMethodService.LabelFor(item)', 'SweetsPOS.Services.PaymentMethodService.LabelFor(item)')
          Set-Content -Path $refundsPath -Value $refunds -Encoding utf8

          $onlinePath = Join-Path $sourceDir 'Services\OnlineSyncService.cs'
          $online = Get-Content $onlinePath -Raw
          $online = $online.Replace('var key = GetString(m, "key");', 'var methodKey = GetString(m, "key");')
          $online = $online.Replace('string.IsNullOrWhiteSpace(key) || string.IsNullOrWhiteSpace(name)', 'string.IsNullOrWhiteSpace(methodKey) || string.IsNullOrWhiteSpace(name)')
          $online = $online.Replace('x.Key.Equals(key, StringComparison.OrdinalIgnoreCase)', 'x.Key.Equals(methodKey, StringComparison.OrdinalIgnoreCase)')
          $online = $online.Replace('Key = key, Name = name,', 'Key = methodKey, Name = name,')
          Set-Content -Path $onlinePath -Value $online -Encoding utf8

          if ((Get-Content $refundsPath -Raw) -notmatch 'SweetsPOS\.Services\.PaymentMethodService') { throw "Refunds payment label repair failed." }
          if ((Get-Content $onlinePath -Raw) -notmatch 'var methodKey = GetString') { throw "Online sync key repair failed." }

          Write-Host "Geek POS v2.0.0 source overlay applied."

      - name: Apply Geek POS v2.0.1 activation hotfix
        shell: pwsh
        run: |
          $sourceDir = Join-Path $env:GITHUB_WORKSPACE 'source'
          Copy-Item "$env:GITHUB_WORKSPACE\v201-overlay\*" $sourceDir -Recurse -Force
          $project = Get-Content (Join-Path $sourceDir 'SweetsPOS.csproj') -Raw
          $installer = Get-Content (Join-Path $sourceDir 'installer.iss') -Raw
          if ($project -notmatch '<Version>2\.0\.1</Version>') { throw "Project version is not 2.0.1" }
          if ($installer -notmatch 'MyAppVersion "2\.0\.1"') { throw "Installer version is not 2.0.1" }
          if ($installer -match 'WinHttp\.WinHttpRequest') { throw "Old WinHttp activation code is still present." }
          if ($installer -notmatch 'Invoke-RestMethod') { throw "PowerShell activation hotfix is missing." }
          Write-Host "Geek POS v2.0.1 activation hotfix applied."

      - name: Apply Geek POS v2.0.2 installer runtime hotfix
        shell: pwsh
        run: |
          $sourceDir = Join-Path $env:GITHUB_WORKSPACE 'source'
          Copy-Item "$env:GITHUB_WORKSPACE\v202-overlay\*" $sourceDir -Recurse -Force
          $project = Get-Content (Join-Path $sourceDir 'SweetsPOS.csproj') -Raw
          $installer = Get-Content (Join-Path $sourceDir 'installer.iss') -Raw
          if ($project -notmatch '<Version>2\.0\.2</Version>') { throw "Project version is not 2.0.2" }
          if ($installer -notmatch 'MyAppVersion "2\.0\.2"') { throw "Installer version is not 2.0.2" }
          if ($installer -match 'GetSHA256OfUnicodeString') { throw "Inno SHA hashing code is still present." }
          if ($installer -notmatch 'GetDateTimeString') { throw "v2.0.2 install ID generation is missing." }
          Write-Host "Geek POS v2.0.2 installer runtime hotfix applied."

      - name: Package Geek POS v2.0.2 source
        shell: pwsh
        run: |
          $sourceDir = Join-Path $env:GITHUB_WORKSPACE 'source'
          $sourceZip = Join-Path $env:GITHUB_WORKSPACE 'GeekPOS-Source-v2.0.2.zip'
          if (Test-Path $sourceZip) { Remove-Item $sourceZip -Force }
          tar -a -c -f $sourceZip -C $sourceDir .
          if (!(Test-Path $sourceZip)) { throw "Source ZIP was not created." }
          Get-Item $sourceZip | Select-Object FullName, Length

      - name: Setup .NET 10 SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.401'

      - name: Show .NET information
        shell: pwsh
        run: dotnet --info

      - name: Install Inno Setup 6
        shell: pwsh
        run: |
          choco install innosetup -y --no-progress
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          if (!(Test-Path $iscc)) {
            $cmd = Get-Command ISCC.exe -ErrorAction SilentlyContinue
            if (-not $cmd) { throw "Inno Setup compiler was not found." }
          }

      - name: Build Geek POS and Setup.exe
        shell: pwsh
        working-directory: source
        run: |
          Set-ExecutionPolicy -Scope Process Bypass -Force
          .\build.ps1

      - name: Verify build outputs
        shell: pwsh
        run: |
          $app = Join-Path $env:GITHUB_WORKSPACE 'source\artifacts\final-win-x64\App.exe'
          $setup = Join-Path $env:GITHUB_WORKSPACE 'source\artifacts\installer-fixed\GeekPOS-Setup-x64-v2.0.2.exe'
          if (!(Test-Path $app)) { throw "App.exe was not created: $app" }
          if (!(Test-Path $setup)) { throw "Setup.exe was not created: $setup" }
          Get-Item $app, $setup | Select-Object FullName, Length, LastWriteTime

      - name: Upload Geek POS Setup
        uses: actions/upload-artifact@v4
        with:
          name: GeekPOS-Setup-x64-v2.0.2
          path: source/artifacts/installer-fixed/GeekPOS-Setup-x64-v2.0.2.exe
          if-no-files-found: error
          compression-level: 0
          retention-days: 14

      - name: Upload portable application
        uses: actions/upload-artifact@v4
        with:
          name: GeekPOS-Portable-win-x64
          path: source/artifacts/final-win-x64/**
          if-no-files-found: error
          compression-level: 6
          retention-days: 14

      - name: Upload full Geek POS source
        uses: actions/upload-artifact@v4
        with:
          name: GeekPOS-Source-v2.0.2
          path: |
            source/**
            !source/artifacts/**
            !source/bin/**
            !source/obj/**
          if-no-files-found: error
          compression-level: 6
          retention-days: 14

      - name: Upload Geek POS Online Dashboard HTML
        uses: actions/upload-artifact@v4
        with:
          name: GeekPOS-Online-Dashboard-HTML
          path: source/OnlineDashboard/index.html
          if-no-files-found: error
          compression-level: 0
          retention-days: 14
