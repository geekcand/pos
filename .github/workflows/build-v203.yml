name: Build Geek POS v2.0.3

on:
  push:
    branches: [ main ]
    paths:
      - ".github/workflows/build-v203.yml"
      - "geek-v203-overlay/**"
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  build-v203:
    runs-on: windows-latest
    timeout-minutes: 35
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download verified v2.0.2 source
        uses: actions/download-artifact@v4
        with:
          name: GeekPOS-Source-v2.0.2
          path: source
          github-token: ${{ secrets.GITHUB_TOKEN }}
          repository: geekcand/pos
          run-id: 36682062806

      - name: Verify base source
        shell: pwsh
        run: |
          if (!(Test-Path "$env:GITHUB_WORKSPACE\source\SweetsPOS.csproj")) {
            throw "v2.0.2 source artifact was not downloaded correctly."
          }

      - name: Apply v2.0.3 standalone activation overlay
        shell: pwsh
        run: |
          $overlay64 = Get-Content "$env:GITHUB_WORKSPACE\geek-v203-overlay\part00.txt" -Raw
          $overlayZip = Join-Path $env:GITHUB_WORKSPACE 'GeekPOS-v2.0.3-overlay.zip'
          [IO.File]::WriteAllBytes($overlayZip, [Convert]::FromBase64String($overlay64))
          $hash = (Get-FileHash $overlayZip -Algorithm SHA256).Hash.ToLowerInvariant()
          $expected = '7de930a3c3ed45cdc372463a29271c94ae6062eb57b5930e5165183c5983bca7'
          if ($hash -ne $expected) { throw "v2.0.3 overlay checksum mismatch: $hash" }
          Expand-Archive -Path $overlayZip -DestinationPath "$env:GITHUB_WORKSPACE\source" -Force
          if (!(Test-Path "$env:GITHUB_WORKSPACE\source\InstallerTools\GeekPOS-Activate.ps1")) {
            throw "Activation helper is missing."
          }

      - name: Verify licensing server from Windows
        shell: pwsh
        run: |
          $out = Join-Path $env:GITHUB_WORKSPACE 'activation-diagnostic.txt'
          & "$env:GITHUB_WORKSPACE\source\InstallerTools\GeekPOS-Activate.ps1" -Serial "GEEK-TEST-INVALID-0000" -OutFile $out
          $result = (Get-Content $out -Raw).Trim()
          Write-Host "Activation diagnostic result: $result"
          if ($result -ne 'ERR|REJECTED') {
            throw "Licensing server diagnostic failed: $result"
          }

      - name: Setup .NET 10 SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.401'

      - name: Install Inno Setup 6
        shell: pwsh
        run: choco install innosetup -y --no-progress

      - name: Build Geek POS v2.0.3
        shell: pwsh
        working-directory: source
        run: |
          Set-ExecutionPolicy -Scope Process Bypass -Force
          .\build.ps1

      - name: Verify v2.0.3 outputs
        shell: pwsh
        run: |
          $app = "$env:GITHUB_WORKSPACE\source\artifacts\final-win-x64\App.exe"
          $setup = "$env:GITHUB_WORKSPACE\source\artifacts\installer-fixed\GeekPOS-Setup-x64-v2.0.3.exe"
          if (!(Test-Path $app)) { throw "App.exe missing." }
          if (!(Test-Path $setup)) { throw "v2.0.3 Setup missing." }
          Get-Item $app, $setup | Select-Object FullName, Length, LastWriteTime

      - name: Upload Geek POS v2.0.3 Setup
        uses: actions/upload-artifact@v4
        with:
          name: GeekPOS-Setup-x64-v2.0.3
          path: source/artifacts/installer-fixed/GeekPOS-Setup-x64-v2.0.3.exe
          if-no-files-found: error
          compression-level: 0
          retention-days: 14

      - name: Upload Geek POS v2.0.3 source
        uses: actions/upload-artifact@v4
        with:
          name: GeekPOS-Source-v2.0.3
          path: |
            source/**
            !source/artifacts/**
            !source/bin/**
            !source/obj/**
          if-no-files-found: error
          retention-days: 14
