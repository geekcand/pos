name: Build Geek POS v2.0.4

on:
  push:
    branches: [ main ]
    paths:
      - ".github/workflows/build-v204.yml"
      - "geek-v204-overlay/**"
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  build-v204:
    runs-on: windows-latest
    timeout-minutes: 35
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download verified v2.0.3 source
        uses: actions/download-artifact@v4
        with:
          name: GeekPOS-Source-v2.0.3
          path: source
          github-token: ${{ secrets.GITHUB_TOKEN }}
          repository: geekcand/pos
          run-id: 36685481633

      - name: Verify base source
        shell: pwsh
        run: |
          if (!(Test-Path "$env:GITHUB_WORKSPACE\source\SweetsPOS.csproj")) {
            throw "v2.0.3 source artifact was not downloaded correctly."
          }

      - name: Apply Geek POS v2.0.4 overlay
        shell: pwsh
        run: |
          $overlay64 = Get-Content "$env:GITHUB_WORKSPACE\geek-v204-overlay\part00.txt" -Raw
          $overlayZip = Join-Path $env:GITHUB_WORKSPACE 'GeekPOS-v2.0.4-overlay.zip'
          [IO.File]::WriteAllBytes($overlayZip, [Convert]::FromBase64String($overlay64))
          $hash = (Get-FileHash $overlayZip -Algorithm SHA256).Hash.ToLowerInvariant()
          $expected = 'b6732060d39400a847ec4d54b03393c732a43c1bfdce9812a227e94ba91272cd'
          if ($hash -ne $expected) { throw "v2.0.4 overlay checksum mismatch: $hash" }
          Expand-Archive -Path $overlayZip -DestinationPath "$env:GITHUB_WORKSPACE\source" -Force

      - name: Verify v2.0.4 requested changes
        shell: pwsh
        run: |
          $admin = Get-Content "$env:GITHUB_WORKSPACE\source\Pages\AdminPage.xaml" -Raw
          $pos = Get-Content "$env:GITHUB_WORKSPACE\source\Pages\PosPage.xaml.cs" -Raw
          $project = Get-Content "$env:GITHUB_WORKSPACE\source\SweetsPOS.csproj" -Raw
          $installer = Get-Content "$env:GITHUB_WORKSPACE\source\installer.iss" -Raw

          $categoriesIndex = $admin.IndexOf('x:Name="CategoriesBtn"')
          $productsIndex = $admin.IndexOf('x:Name="ProductsBtn"')
          $paymentsIndex = $admin.IndexOf('x:Name="PaymentMethodsBtn"')
          if ($categoriesIndex -lt 0 -or $productsIndex -lt 0 -or $paymentsIndex -lt 0) { throw "Admin navigation buttons are missing." }
          if (!($categoriesIndex -lt $productsIndex -and $productsIndex -lt $paymentsIndex)) { throw "Admin navigation order is incorrect." }
          if ($admin -notmatch 'Content="🍬 الأصناف"') { throw "Products label was not changed to الأصناف." }
          if ($admin -notmatch 'إدارة طرق الدفع') { throw "Payment methods admin access is missing." }

          if ($pos -notmatch 'TryDecimalFromText') { throw "Quantity text parsing fix is missing." }
          if ($pos -notmatch 'RegisterPropertyChangedCallback\(NumberBox\.TextProperty') { throw "Live payment refresh hook is missing." }
          if ($pos -match 'if \(qty <= 0\) _cart\.Remove\(line\)') { throw "Old Enter-to-delete quantity behavior is still present." }

          if ($project -notmatch '<Version>2\.0\.4</Version>') { throw "Project version is not 2.0.4." }
          if ($installer -notmatch 'MyAppVersion "2\.0\.4"') { throw "Installer version is not 2.0.4." }

      - name: Setup .NET 10 SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.401'

      - name: Install Inno Setup 6
        shell: pwsh
        run: choco install innosetup -y --no-progress

      - name: Build Geek POS v2.0.4
        shell: pwsh
        working-directory: source
        run: |
          Set-ExecutionPolicy -Scope Process Bypass -Force
          .\build.ps1

      - name: Verify v2.0.4 outputs
        shell: pwsh
        run: |
          $app = "$env:GITHUB_WORKSPACE\source\artifacts\final-win-x64\App.exe"
          $setup = "$env:GITHUB_WORKSPACE\source\artifacts\installer-fixed\GeekPOS-Setup-x64-v2.0.4.exe"
          if (!(Test-Path $app)) { throw "App.exe missing." }
          if (!(Test-Path $setup)) { throw "v2.0.4 Setup missing." }
          Get-Item $app, $setup | Select-Object FullName, Length, LastWriteTime

      - name: Upload Geek POS v2.0.4 Setup
        uses: actions/upload-artifact@v4
        with:
          name: GeekPOS-Setup-x64-v2.0.4
          path: source/artifacts/installer-fixed/GeekPOS-Setup-x64-v2.0.4.exe
          if-no-files-found: error
          compression-level: 0
          retention-days: 14

      - name: Upload Geek POS v2.0.4 source
        uses: actions/upload-artifact@v4
        with:
          name: GeekPOS-Source-v2.0.4
          path: |
            source/**
            !source/artifacts/**
            !source/bin/**
            !source/obj/**
          if-no-files-found: error
          retention-days: 14
