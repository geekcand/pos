name: Build Geek POS v2.0.5

on:
  push:
    branches: [ main ]
    paths:
      - ".github/workflows/build-v205.yml"
      - "v205-patch/**"
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  build-v205:
    runs-on: windows-latest
    timeout-minutes: 35
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download verified v2.0.4 source
        uses: actions/download-artifact@v4
        with:
          name: GeekPOS-Source-v2.0.4
          path: source
          github-token: ${{ secrets.GITHUB_TOKEN }}
          repository: geekcand/pos
          run-id: 36689421638

      - name: Verify base source
        shell: pwsh
        run: |
          if (!(Test-Path "$env:GITHUB_WORKSPACE\source\SweetsPOS.csproj")) {
            throw "v2.0.4 source artifact was not downloaded correctly."
          }
          $shell = Get-Content "$env:GITHUB_WORKSPACE\source\Pages\ShellPage.xaml" -Raw
          if ($shell -notmatch '🍬 المنتجات') {
            throw "Expected v2.0.4 runtime ShellPage was not found."
          }

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Apply v2.0.5 patch to actual runtime pages
        shell: pwsh
        run: |
          python "$env:GITHUB_WORKSPACE\v205-patch\apply.py" "$env:GITHUB_WORKSPACE\source"

      - name: Verify v2.0.5 runtime changes
        shell: pwsh
        run: |
          $shell = Get-Content "$env:GITHUB_WORKSPACE\source\Pages\ShellPage.xaml" -Raw
          $shellCode = Get-Content "$env:GITHUB_WORKSPACE\source\Pages\ShellPage.xaml.cs" -Raw
          $posXaml = Get-Content "$env:GITHUB_WORKSPACE\source\Pages\PosPage.xaml" -Raw
          $posCode = Get-Content "$env:GITHUB_WORKSPACE\source\Pages\PosPage.xaml.cs" -Raw
          $project = Get-Content "$env:GITHUB_WORKSPACE\source\SweetsPOS.csproj" -Raw
          $installer = Get-Content "$env:GITHUB_WORKSPACE\source\installer.iss" -Raw

          $cat = $shell.IndexOf('x:Name="CategoriesNav"')
          $items = $shell.IndexOf('x:Name="ProductsNav"')
          $pay = $shell.IndexOf('x:Name="PaymentMethodsNav"')
          if (!($cat -ge 0 -and $cat -lt $items -and $items -lt $pay)) { throw "Actual admin sidebar order is wrong." }
          if ($shell -notmatch 'Content="🍬 الأصناف"') { throw "Actual admin sidebar still does not say الأصناف." }
          if ($shell -match 'Content="🍬 المنتجات"') { throw "Old products label is still in actual ShellPage." }
          if ($shellCode -notmatch '"payments" => typeof\(PaymentMethodsPage\)') { throw "Payment methods navigation is not wired." }

          if ($posXaml -notmatch '<TextBox Grid.Column="2" Text="\{Binding Quantity') { throw "Quantity is not a direct TextBox." }
          if ($posXaml -match '<NumberBox Grid.Column="2"') { throw "Old quantity NumberBox still exists." }
          if ($posCode -notmatch 'Dictionary<string, TextBox>') { throw "Payment fields are not TextBoxes." }
          if ($posCode -notmatch 'box.TextChanged \+= \(_, _\) => RefreshBalance\(\);') { throw "Immediate payment refresh is missing." }
          if ($posCode -notmatch 'sender is not TextBox box') { throw "Quantity Enter handler is not using TextBox." }

          if ($project -notmatch '<Version>2\.0\.5</Version>') { throw "Project version is not 2.0.5." }
          if ($installer -notmatch 'MyAppVersion "2\.0\.5"') { throw "Installer version is not 2.0.5." }

      - name: Verify licensing helper is preserved
        shell: pwsh
        run: |
          $out = Join-Path $env:GITHUB_WORKSPACE 'activation-diagnostic.txt'
          & "$env:GITHUB_WORKSPACE\source\InstallerTools\GeekPOS-Activate.ps1" -Serial "GEEK-TEST-INVALID-0000" -OutFile $out
          $result = (Get-Content $out -Raw).Trim()
          Write-Host "Activation diagnostic result: $result"
          if ($result -ne 'ERR|REJECTED') { throw "Licensing helper changed unexpectedly: $result" }

      - name: Setup .NET 10 SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.401'

      - name: Install Inno Setup 6
        shell: pwsh
        run: choco install innosetup -y --no-progress

      - name: Build Geek POS v2.0.5
        shell: pwsh
        working-directory: source
        run: |
          Set-ExecutionPolicy -Scope Process Bypass -Force
          .\build.ps1

      - name: Verify v2.0.5 outputs
        shell: pwsh
        run: |
          $app = "$env:GITHUB_WORKSPACE\source\artifacts\final-win-x64\App.exe"
          $setup = "$env:GITHUB_WORKSPACE\source\artifacts\installer-fixed\GeekPOS-Setup-x64-v2.0.5.exe"
          if (!(Test-Path $app)) { throw "App.exe missing." }
          if (!(Test-Path $setup)) { throw "v2.0.5 Setup missing." }
          Get-Item $app, $setup | Select-Object FullName, Length, LastWriteTime

      - name: Upload Geek POS v2.0.5 Setup
        uses: actions/upload-artifact@v4
        with:
          name: GeekPOS-Setup-x64-v2.0.5
          path: source/artifacts/installer-fixed/GeekPOS-Setup-x64-v2.0.5.exe
          if-no-files-found: error
          compression-level: 0
          retention-days: 14

      - name: Upload Geek POS v2.0.5 source
        uses: actions/upload-artifact@v4
        with:
          name: GeekPOS-Source-v2.0.5
          path: |
            source/**
            !source/artifacts/**
            !source/bin/**
            !source/obj/**
          if-no-files-found: error
          retention-days: 14
