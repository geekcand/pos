name: Build Geek POS v2.0.6 fixed

on:
  push:
    branches: [ main ]
    paths:
      - ".github/workflows/build-v206-fixed.yml"
      - "v206-patch/**"
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  build-v206:
    runs-on: windows-latest
    timeout-minutes: 35
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download verified v2.0.5 source
        uses: actions/download-artifact@v4
        with:
          name: GeekPOS-Source-v2.0.5
          path: source
          github-token: ${{ secrets.GITHUB_TOKEN }}
          repository: geekcand/pos
          run-id: 36692485073

      - name: Verify base source
        shell: pwsh
        run: |
          if (!(Test-Path "$env:GITHUB_WORKSPACE\source\SweetsPOS.csproj")) {
            throw "v2.0.5 source artifact was not downloaded correctly."
          }

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Apply v2.0.6 patch
        shell: pwsh
        run: |
          python "$env:GITHUB_WORKSPACE\v206-patch\apply.py" "$env:GITHUB_WORKSPACE\source"

      - name: Verify offline licensing and drawer changes
        shell: pwsh
        run: |
          $license = Get-Content "$env:GITHUB_WORKSPACE\source\Services\LicenseService.cs" -Raw
          $activation = Get-Content "$env:GITHUB_WORKSPACE\source\Pages\ActivationPage.xaml.cs" -Raw
          $receipt = Get-Content "$env:GITHUB_WORKSPACE\source\Services\ReceiptService.cs" -Raw
          $settings = Get-Content "$env:GITHUB_WORKSPACE\source\Pages\SettingsPage.xaml" -Raw
          $helper = Get-Content "$env:GITHUB_WORKSPACE\source\InstallerTools\GeekPOS-Activate.ps1" -Raw
          $installer = Get-Content "$env:GITHUB_WORKSPACE\source\installer.iss" -Raw
          $project = Get-Content "$env:GITHUB_WORKSPACE\source\SweetsPOS.csproj" -Raw

          if ($license -notmatch 'ComputeDeviceBinding') { throw "Device-bound local activation is missing." }
          if ($license -notmatch 'Offline/server unavailable must never disable') { throw "Offline license fallback is missing." }
          if ($activation -notmatch 'TryRefreshOnlineAsync') { throw "Background online license refresh is missing." }
          if ($receipt -notmatch 'CashDrawerKickCommand') { throw "Cash drawer ESC/POS pulse is missing." }
          if ($receipt -notmatch 'hasCashPayment') { throw "Cash-only automatic drawer rule is missing." }
          if ($settings -notmatch 'CashDrawerAutoOpen') { throw "Cash drawer setting is missing." }
          if ($settings -notmatch 'اختبار فتح درج النقدية') { throw "Cash drawer test button is missing." }
          if ($helper -notmatch 'GeekPOS-local-v1') { throw "Installer device binding generation is missing." }
          if ($installer -notmatch 'DeviceBinding') { throw "Installer activation state binding is missing." }
          if ($project -notmatch '<Version>2\.0\.6</Version>') { throw "Project version is not 2.0.6." }
          if ($installer -notmatch 'MyAppVersion "2\.0\.6"') { throw "Installer version is not 2.0.6." }

      - name: Verify licensing server helper
        shell: pwsh
        run: |
          $out = Join-Path $env:GITHUB_WORKSPACE 'activation-diagnostic.txt'
          & "$env:GITHUB_WORKSPACE\source\InstallerTools\GeekPOS-Activate.ps1" -Serial "GEEK-TEST-INVALID-0000" -OutFile $out
          $result = (Get-Content $out -Raw).Trim()
          Write-Host "Activation diagnostic result: $result"
          if ($result -ne 'ERR|REJECTED') { throw "Licensing helper diagnostic failed: $result" }

      - name: Setup .NET 10 SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.401'

      - name: Install Inno Setup 6
        shell: pwsh
        run: choco install innosetup -y --no-progress

      - name: Build Geek POS v2.0.6
        shell: pwsh
        working-directory: source
        run: |
          Set-ExecutionPolicy -Scope Process Bypass -Force
          .\build.ps1

      - name: Verify v2.0.6 outputs
        shell: pwsh
        run: |
          $app = "$env:GITHUB_WORKSPACE\source\artifacts\final-win-x64\App.exe"
          $setup = "$env:GITHUB_WORKSPACE\source\artifacts\installer-fixed\GeekPOS-Setup-x64-v2.0.6.exe"
          if (!(Test-Path $app)) { throw "App.exe missing." }
          if (!(Test-Path $setup)) { throw "v2.0.6 Setup missing." }
          Get-Item $app, $setup | Select-Object FullName, Length, LastWriteTime

      - name: Upload Geek POS v2.0.6 Setup
        uses: actions/upload-artifact@v4
        with:
          name: GeekPOS-Setup-x64-v2.0.6
          path: source/artifacts/installer-fixed/GeekPOS-Setup-x64-v2.0.6.exe
          if-no-files-found: error
          compression-level: 0
          retention-days: 14

      - name: Upload Geek POS v2.0.6 source
        uses: actions/upload-artifact@v4
        with:
          name: GeekPOS-Source-v2.0.6
          path: |
            source/**
            !source/artifacts/**
            !source/bin/**
            !source/obj/**
          if-no-files-found: error
          retention-days: 14
