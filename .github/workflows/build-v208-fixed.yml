name: Build Geek POS v2.0.8 Fixed

on:
  push:
    branches: [ main ]
    paths:
      - ".github/workflows/build-v208-fixed.yml"
      - "patches/v208-pos-fixes.ps1"
      - "patches/v208-pos-fixes-wrapper.ps1"
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  build-v208-fixed:
    runs-on: windows-latest
    timeout-minutes: 35
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download verified v2.0.7 source
        uses: actions/download-artifact@v4
        with:
          name: GeekPOS-Source-v2.0.7
          path: source
          github-token: ${{ github.token }}
          repository: geekcand/pos
          run-id: 36795189331

      - name: Apply v2.0.8 quantity and RTL fixes
        shell: pwsh
        run: |
          if (!(Test-Path "$env:GITHUB_WORKSPACE\source\SweetsPOS.csproj")) { throw "v2.0.7 source artifact missing." }
          & "$env:GITHUB_WORKSPACE\patches\v208-pos-fixes-wrapper.ps1" -SourceRoot "$env:GITHUB_WORKSPACE\source"

      - name: Verify requested fixes
        shell: pwsh
        run: |
          $xaml = Get-Content "$env:GITHUB_WORKSPACE\source\Pages\PosPage.xaml" -Raw
          $code = Get-Content "$env:GITHUB_WORKSPACE\source\Pages\PosPage.xaml.cs" -Raw
          $project = Get-Content "$env:GITHUB_WORKSPACE\source\SweetsPOS.csproj" -Raw
          $installer = Get-Content "$env:GITHUB_WORKSPACE\source\installer.iss" -Raw
          if ($xaml -notmatch 'CartList.*FlowDirection="RightToLeft"') { throw "Cart RTL fix missing." }
          if ($xaml -notmatch 'Width="112"') { throw "Quantity editor width fix missing." }
          if ($xaml -notmatch 'MinWidth="112"') { throw "Quantity editor minimum width missing." }
          if ($code -notmatch 'var weightLabel = new TextBlock') { throw "Weight label RTL fix missing." }
          if ($code -notmatch 'panel = new StackPanel \{ Width = 390, Spacing = 10, FlowDirection = FlowDirection.LeftToRight') { throw "Weight content direction fix missing." }
          if ($project -notmatch '<Version>2\.0\.8</Version>') { throw "Project version incorrect." }
          if ($installer -notmatch 'MyAppVersion "2\.0\.8"') { throw "Installer version incorrect." }

      - name: Verify licensing helper
        shell: pwsh
        run: |
          $out = Join-Path $env:GITHUB_WORKSPACE 'activation-diagnostic.txt'
          & "$env:GITHUB_WORKSPACE\source\InstallerTools\GeekPOS-Activate.ps1" -Serial "GEEK-TEST-INVALID-0000" -OutFile $out
          $result = (Get-Content $out -Raw).Trim()
          if ($result -ne 'ERR|REJECTED') { throw "Licensing helper changed unexpectedly: $result" }

      - name: Setup .NET 10 SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.401'

      - name: Install Inno Setup 6
        shell: pwsh
        run: choco install innosetup -y --no-progress

      - name: Build Geek POS v2.0.8
        shell: pwsh
        working-directory: source
        run: |
          Set-ExecutionPolicy -Scope Process Bypass -Force
          .\build.ps1

      - name: Verify output
        shell: pwsh
        run: |
          $setup = "$env:GITHUB_WORKSPACE\source\artifacts\installer-fixed\GeekPOS-Setup-x64-v2.0.8.exe"
          if (!(Test-Path $setup)) { throw "v2.0.8 Setup missing." }

      - name: Upload Geek POS v2.0.8 Setup
        uses: actions/upload-artifact@v4
        with:
          name: GeekPOS-Setup-x64-v2.0.8
          path: source/artifacts/installer-fixed/GeekPOS-Setup-x64-v2.0.8.exe
          if-no-files-found: error
          compression-level: 0
          retention-days: 14

      - name: Upload Geek POS v2.0.8 source
        uses: actions/upload-artifact@v4
        with:
          name: GeekPOS-Source-v2.0.8
          path: |
            source/**
            !source/artifacts/**
            !source/bin/**
            !source/obj/**
          if-no-files-found: error
          retention-days: 14
