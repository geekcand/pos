name: Build Geek POS v2.0.9 Client Fix

on:
  workflow_dispatch:
  push:
    branches: [ v209-clientfix-build ]
    paths:
      - ".github/workflows/build-v209-clientfix.yml"
      - "clientfix/**"

permissions:
  contents: read
  actions: read

jobs:
  build-v209-clientfix:
    runs-on: windows-latest
    timeout-minutes: 35
    steps:
      - name: Checkout build branch
        uses: actions/checkout@v4

      - name: Download original v2.0.9 source
        uses: actions/download-artifact@v4
        with:
          name: GeekPOS-Source-v2.0.9
          path: source
          github-token: ${{ github.token }}
          repository: geekcand/pos
          run-id: 36806628910

      - name: Reconstruct and apply client-only patch
        shell: pwsh
        run: |
          $parts = 1..4 | ForEach-Object { Join-Path $env:GITHUB_WORKSPACE ("clientfix/patch.part{0:D2}" -f $_) }
          $b64 = ($parts | ForEach-Object { (Get-Content $_ -Raw).Trim() }) -join ''
          $gzBytes = [Convert]::FromBase64String($b64)
          $gzPath = Join-Path $env:RUNNER_TEMP 'v209-clientfix.patch.gz'
          $patchPath = Join-Path $env:RUNNER_TEMP 'v209-clientfix.patch'
          [IO.File]::WriteAllBytes($gzPath, $gzBytes)
          $input = [IO.File]::OpenRead($gzPath)
          try {
            $gzip = [IO.Compression.GzipStream]::new($input, [IO.Compression.CompressionMode]::Decompress)
            try {
              $output = [IO.File]::Create($patchPath)
              try { $gzip.CopyTo($output) } finally { $output.Dispose() }
            } finally { $gzip.Dispose() }
          } finally { $input.Dispose() }
          $hash = (Get-FileHash $patchPath -Algorithm SHA256).Hash.ToLowerInvariant()
          if ($hash -ne 'f83e17201f356134deaefb605babba027b291303b7e5f0396162affd15d96443') { throw "Client patch checksum mismatch: $hash" }
          git apply --check --whitespace=nowarn --directory=source $patchPath
          if ($LASTEXITCODE -ne 0) { throw 'v2.0.9 client patch check failed.' }
          git apply --whitespace=nowarn --directory=source $patchPath
          if ($LASTEXITCODE -ne 0) { throw 'v2.0.9 client patch apply failed.' }

      - name: Verify only requested customer changes
        shell: pwsh
        run: |
          $online = Get-Content "$env:GITHUB_WORKSPACE\source\Pages\OnlinePage.xaml" -Raw
          $shell = Get-Content "$env:GITHUB_WORKSPACE\source\Pages\ShellPage.xaml" -Raw
          $helpers = Get-Content "$env:GITHUB_WORKSPACE\source\Pages\PageHelpers.cs" -Raw
          $shifts = Get-Content "$env:GITHUB_WORKSPACE\source\Pages\ShiftsPage.xaml.cs" -Raw
          $receipt = Get-Content "$env:GITHUB_WORKSPACE\source\Services\ReceiptService.cs" -Raw
          $main = Get-Content "$env:GITHUB_WORKSPACE\source\MainWindow.xaml" -Raw
          $dash = Get-Content "$env:GITHUB_WORKSPACE\source\OnlineDashboard\index.html" -Raw
          $project = Get-Content "$env:GITHUB_WORKSPACE\source\SweetsPOS.csproj" -Raw
          $installer = Get-Content "$env:GITHUB_WORKSPACE\source\installer.iss" -Raw

          if ($online -notmatch 'الإدارة السحابية') { throw 'Cloud Administration label missing.' }
          if ($online -match 'التجهيز النهائي') { throw 'Developer preparation block is still visible.' }
          if ($shell -notmatch '☁ الإدارة السحابية') { throw 'Cloud navigation label missing.' }
          if ($helpers -notmatch 'FlowDirection = FlowDirection.RightToLeft') { throw 'Customer dialogs are not RTL.' }
          if ($shifts -notmatch 'PrintShiftClosingAsync') { throw 'Shift closing is not using formatted receipt printing.' }
          if ($receipt -notmatch 'RenderShiftClosingImageAsync') { throw 'Formatted 80mm shift receipt renderer missing.' }
          if ($receipt -notmatch 'const int width = 576') { throw '80mm shift receipt width missing.' }
          if ($main -match 'FlowDirection="RightToLeft"') { throw 'Global layout flip detected; v2.0.9 layout must remain intact.' }
          if ($dash -notmatch 'الإدارة السحابية') { throw 'Cloud dashboard customer branding missing.' }
          if ($dash -match 'التجهيز النهائي') { throw 'Developer wording remains in dashboard.' }
          if ($project -notmatch '<Version>2\.0\.9</Version>') { throw 'Base version is not v2.0.9.' }
          if ($installer -notmatch 'MyAppVersion "2\.0\.9"') { throw 'Installer is not v2.0.9.' }

      - name: Verify licensing helper unchanged
        shell: pwsh
        run: |
          $out = Join-Path $env:GITHUB_WORKSPACE 'activation-diagnostic.txt'
          & "$env:GITHUB_WORKSPACE\source\InstallerTools\GeekPOS-Activate.ps1" -Serial "GEEK-TEST-INVALID-0000" -OutFile $out
          $result = (Get-Content $out -Raw).Trim()
          if ($result -ne 'ERR|REJECTED') { throw "Licensing helper changed unexpectedly: $result" }

      - name: Setup .NET 10 SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.401'

      - name: Install Inno Setup 6
        shell: pwsh
        run: choco install innosetup -y --no-progress

      - name: Build from original v2.0.9 base
        shell: pwsh
        working-directory: source
        run: |
          Set-ExecutionPolicy -Scope Process Bypass -Force
          .\build.ps1

      - name: Verify Setup output
        shell: pwsh
        run: |
          $setup = "$env:GITHUB_WORKSPACE\source\artifacts\installer-fixed\GeekPOS-Setup-x64-v2.0.9.exe"
          if (!(Test-Path $setup)) { throw 'v2.0.9 client-fix Setup missing.' }

      - name: Upload v2.0.9 client-fix Setup
        uses: actions/upload-artifact@v4
        with:
          name: GeekPOS-Setup-x64-v2.0.9-clientfix
          path: source/artifacts/installer-fixed/GeekPOS-Setup-x64-v2.0.9.exe
          if-no-files-found: error
          compression-level: 0
          retention-days: 14

      - name: Upload verified client-fix source
        uses: actions/upload-artifact@v4
        with:
          name: GeekPOS-Source-v2.0.9-clientfix
          path: |
            source/**
            !source/artifacts/**
            !source/bin/**
            !source/obj/**
          if-no-files-found: error
          retention-days: 14
