name: Build Geek POS v2.0.9 Hard RTL

on:
  push:
    branches: [ main ]
    paths:
      - ".github/workflows/build-v209-hard-rtl.yml"
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  build-hard-rtl:
    runs-on: windows-latest
    timeout-minutes: 40
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download latest tested RTL multi-branch source
        uses: actions/download-artifact@v4
        with:
          name: GeekPOS-Source-v2.0.9-rtl-multibranch
          path: source
          github-token: ${{ github.token }}
          repository: geekcand/pos
          run-id: 37174426774

      - name: Apply reviewed physical RTL overlay only
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $root = "$env:GITHUB_WORKSPACE\source"
          if (!(Test-Path "$root\SweetsPOS.csproj")) { throw 'Latest tested source artifact missing.' }

          $before = @{}
          Get-ChildItem $root -Recurse -File | ForEach-Object {
            $rel = $_.FullName.Substring($root.Length + 1)
            $before[$rel] = (Get-FileHash $_.FullName -Algorithm SHA256).Hash
          }

          $d = "$env:GITHUB_WORKSPACE\patches\v209-hard-rtl"
          $names = @('chunk00.txt','chunk01.txt','chunk02.txt','chunk03.txt','chunk04.txt','chunk05.txt','chunk06.txt','chunk07.txt','chunk08.txt')
          foreach ($n in $names) { if (!(Test-Path (Join-Path $d $n))) { throw "Missing overlay part $n" } }
          $b64 = ($names | ForEach-Object { (Get-Content (Join-Path $d $_) -Raw).Trim() }) -join ''
          if ($b64.Length -ne 33232) { throw "Overlay base64 length mismatch: $($b64.Length)" }
          $zip = Join-Path $env:RUNNER_TEMP 'hard-rtl-overlay.zip'
          [IO.File]::WriteAllBytes($zip,[Convert]::FromBase64String($b64))
          $digest = (Get-FileHash $zip -Algorithm SHA256).Hash.ToLowerInvariant()
          if ($digest -ne '7b948fbc4c4a33b9d1061e2dfbe4fae9e0d999be3c3060c702c0123f1c5d9e96') { throw "Overlay SHA256 mismatch: $digest" }
          Expand-Archive -LiteralPath $zip -DestinationPath $root -Force

          $allowed = @(
            'App.xaml',
            'Pages\AdminPage.xaml',
            'Pages\AuditPage.xaml',
            'Pages\CategoriesPage.xaml',
            'Pages\DashboardPage.xaml',
            'Pages\ExpensesPage.xaml',
            'Pages\OnlinePage.xaml',
            'Pages\PaymentMethodsPage.xaml',
            'Pages\PosPage.xaml',
            'Pages\ProductsPage.xaml',
            'Pages\ReceiptDesignerPage.xaml',
            'Pages\RefundsPage.xaml',
            'Pages\ReportsPage.xaml',
            'Pages\SettingsPage.xaml',
            'Pages\ShellPage.xaml',
            'Pages\ShiftsPage.xaml',
            'Pages\UsersPage.xaml'
          )
          $changed = @()
          Get-ChildItem $root -Recurse -File | ForEach-Object {
            $rel = $_.FullName.Substring($root.Length + 1)
            $hash = (Get-FileHash $_.FullName -Algorithm SHA256).Hash
            if (!$before.ContainsKey($rel) -or $before[$rel] -ne $hash) { $changed += $rel }
          }
          $unexpected = @($changed | Where-Object { $_ -notin $allowed })
          if ($unexpected.Count) { throw "Unexpected files changed: $($unexpected -join ', ')" }
          $missing = @($allowed | Where-Object { $_ -notin $changed })
          if ($missing.Count) { throw "Expected reviewed files did not change: $($missing -join ', ')" }
          Write-Host "Physical RTL overlay applied to exactly $($changed.Count) approved files."

      - name: Verify physical right alignment requirements
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          $r="$env:GITHUB_WORKSPACE\source"
          function T($p){ Get-Content (Join-Path $r $p) -Raw }
          function Need($x,$m){ if(!$x){ throw $m } }

          $app=T 'App.xaml'
          Need ($app.Contains('x:Key="RtlFieldHeaderTemplate"')) 'RTL field HeaderTemplate missing.'
          Need (($app -match 'x:Key="SectionTitleStyle"[\s\S]{0,900}HorizontalAlignment" Value="Right"') -or ($app -match 'x:Key="SectionTitleStyle"[\s\S]{0,900}<Setter Property="HorizontalAlignment" Value="Right"')) 'Section titles are not physically pinned right.'
          Need (($app -match 'x:Key="SubTitleStyle"[\s\S]{0,900}HorizontalAlignment" Value="Right"') -or ($app -match 'x:Key="SubTitleStyle"[\s\S]{0,900}<Setter Property="HorizontalAlignment" Value="Right"')) 'Subtitles are not physically pinned right.'

          foreach($p in @('Pages\CategoriesPage.xaml','Pages\ProductsPage.xaml','Pages\PaymentMethodsPage.xaml','Pages\UsersPage.xaml')){
            $x=T $p
            Need ($x.Contains('FlowDirection="LeftToRight"')) "$p does not use deterministic structural direction."
            Need (($x -split 'HorizontalAlignment="Right"').Count -ge 4) "$p title/helper/action are not physically pinned right."
          }

          $cat=T 'Pages\CategoriesPage.xaml'
          Need ($cat -match 'Text="الأقسام"[^>]*HorizontalAlignment="Right"') 'Categories title is not physically right.'
          Need ($cat -match 'رتّب الأقسام[^<"]*"[^>]*HorizontalAlignment="Right"') 'Categories helper is not physically right.'

          $products=T 'Pages\ProductsPage.xaml'
          Need ($products -match 'Text="الأصناف"[^>]*HorizontalAlignment="Right"') 'Products title is not physically right.'

          $shifts=T 'Pages\ShiftsPage.xaml'
          $shiftsCs=T 'Pages\ShiftsPage.xaml.cs'
          Need ($shifts -match 'x:Name="CurrentTitle"[^>]*HorizontalAlignment="Right"') 'Current shift title is not physically right.'
          Need ($shifts -match 'Text="آخر الورديات"[^>]*HorizontalAlignment="Right"') 'Recent shifts title is not physically right.'
          foreach($line in @('بدأت:','رصيد افتتاحي:','مبيعات:','كاش:','مصروفات:','مرتجعات:')) { Need ($shiftsCs.Contains($line)) "Vertical shift detail missing: $line" }

          $receipt=T 'Pages\ReceiptDesignerPage.xaml'
          Need (($receipt -split 'HeaderTemplate="{StaticResource RtlFieldHeaderTemplate}"').Count -gt 15) 'Receipt field headers are not using explicit RTL headers.'
          foreach($label in @('بيانات المؤسسة على الفاتورة','الشعار','الباركود','عناوين جدول الفاتورة','خيارات العرض')) { Need ($receipt.Contains($label)) "Receipt section missing: $label" }
          Need (($receipt -split 'HorizontalAlignment="Right"').Count -gt 10) 'Receipt sections are not physically right.'

          foreach($p in @('Pages\ExpensesPage.xaml','Pages\RefundsPage.xaml','Pages\AuditPage.xaml')){
            $x=T $p
            Need (($x -split 'HorizontalAlignment="Right"').Count -ge 4) "$p title/helper are not physically right."
          }

          $online=T 'Pages\OnlinePage.xaml'
          Need ($online.Contains('FlowDirection="LeftToRight"')) 'Cloud structural direction is not deterministic.'
          foreach($id in @('SupabaseUrl','AnonKey','OnlineEmail','OnlinePassword','StoreId')) { Need ($online.Contains("x:Name=`"$id`"")) "Cloud field missing: $id" }
          Need (!$online.Contains('x:Name="SupabaseUrl" Visibility="Collapsed"')) 'Cloud URL is hidden.'
          Need (!$online.Contains('x:Name="AnonKey" Visibility="Collapsed"')) 'Cloud key is hidden.'
          Need (($online -split 'HeaderTemplate="{StaticResource RtlFieldHeaderTemplate}"').Count -ge 6) 'Cloud field headers are not physically RTL.'
          Need (($online -split 'HorizontalAlignment="Right"').Count -ge 7) 'Cloud content is not physically right.'

          $settings=T 'Pages\SettingsPage.xaml'
          Need ($settings.Contains('FlowDirection="LeftToRight"')) 'Settings structural direction is not deterministic.'
          Need (($settings -split 'HeaderTemplate="{StaticResource RtlFieldHeaderTemplate}"').Count -ge 9) 'Settings field headers are not physically RTL.'
          Need (($settings -split 'HorizontalAlignment="Right"').Count -gt 9) 'Settings content is not physically right.'

          $shell=T 'Pages\ShellPage.xaml'
          Need (($shell -split 'HorizontalAlignment="Stretch"').Count -gt 5) 'Admin navigation buttons are not stretched for physical right content.'
          Need (($shell -split 'TextAlignment="Right"').Count -gt 8) 'Admin navigation labels are not explicitly right aligned.'
          Need ($shell.Contains('x:Name="AboutNav"')) 'About navigation was lost.'

          $admin=T 'Pages\AdminPage.xaml'
          Need (($admin -split 'TextAlignment="Right"').Count -gt 5) 'Admin page navigation labels are not explicitly right aligned.'

          $dash=T 'Pages\DashboardPage.xaml'
          Need ($dash -match 'Text="لوحة الإدارة"[^>]*HorizontalAlignment="Right"') 'Dashboard title is not physically right.'

          $reports=T 'Pages\ReportsPage.xaml'
          Need ($reports -match 'Text="التقارير"[^>]*HorizontalAlignment="Right"') 'Reports title is not physically right.'

          $pos=T 'Pages\PosPage.xaml'
          Need ($pos -match '<ColumnDefinition Width="360"\s*/>\s*<ColumnDefinition Width="\*"\s*/>\s*<ColumnDefinition Width="245"\s*/>') 'POS physical cart/products/categories structure changed.'
          Need ($pos -match 'Text="الفاتورة الحالية"[^>]*HorizontalAlignment="Right"') 'Current invoice title is not physically right.'
          Need ($pos -match 'Text="الأصناف"[^>]*HorizontalAlignment="Right"') 'POS products title is not physically right.'
          Need ($pos -match 'Text="الأقسام"[^>]*HorizontalAlignment="Right"') 'POS categories title is not physically right.'
          Need ($pos -match 'Loaded="QuantityBox_Loaded"[^>]*TextAlignment="Center"') 'Quantity input behavior/alignment changed.'

          $about=T 'Pages\AboutPage.xaml'
          Need ($about.Contains('حول Geek POS')) 'About page was lost.'
          Need ($about.Contains('إدارة أبسط • متابعة أوضح • بيع أسرع')) 'About slogan was lost.'

          $cloudDash=T 'OnlineDashboard\index.html'
          Need ($cloudDash.Contains("const ALL_STORES='__ALL__'")) 'Multi-branch ALL mode was lost.'
          Need ($cloudDash.Contains('كل الفروع — ALL')) 'ALL selector was lost.'

          $project=T 'SweetsPOS.csproj'; $iss=T 'installer.iss'
          Need ($project.Contains('<Version>2.0.9</Version>')) 'Project version changed.'
          Need ($iss.Contains('MyAppVersion "2.0.9"')) 'Installer version changed.'
          Write-Host 'Physical RTL checks passed: layout, headers, shift details, cloud fields, POS structure, About and ALL preserved.'

      - name: Verify licensing helper
        shell: pwsh
        run: |
          $out=Join-Path $env:GITHUB_WORKSPACE 'activation-diagnostic.txt'
          & "$env:GITHUB_WORKSPACE\source\InstallerTools\GeekPOS-Activate.ps1" -Serial 'GEEK-TEST-INVALID-0000' -OutFile $out
          if((Get-Content $out -Raw).Trim() -ne 'ERR|REJECTED'){ throw 'Licensing helper changed.' }

      - name: Setup .NET 10 SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.401'

      - name: Install Inno Setup 6
        shell: pwsh
        run: choco install innosetup -y --no-progress

      - name: Build hard RTL setup
        shell: pwsh
        working-directory: source
        run: |
          Set-ExecutionPolicy -Scope Process Bypass -Force
          .\build.ps1

      - name: Stage hard RTL setup
        shell: pwsh
        run: |
          $built="$env:GITHUB_WORKSPACE\source\artifacts\installer-fixed\GeekPOS-Setup-x64-v2.0.9.exe"
          if(!(Test-Path $built)){ throw 'Built setup missing.' }
          $stage="$env:GITHUB_WORKSPACE\source\artifacts\hard-rtl"
          New-Item -ItemType Directory -Force -Path $stage | Out-Null
          Copy-Item $built (Join-Path $stage 'GeekPOS-Setup-x64-v2.0.9-hard-rtl.exe') -Force

      - name: Upload hard RTL setup
        uses: actions/upload-artifact@v4
        with:
          name: GeekPOS-Setup-x64-v2.0.9-hard-rtl
          path: source/artifacts/hard-rtl/GeekPOS-Setup-x64-v2.0.9-hard-rtl.exe
          if-no-files-found: error
          compression-level: 0
          retention-days: 14

      - name: Upload hard RTL source
        uses: actions/upload-artifact@v4
        with:
          name: GeekPOS-Source-v2.0.9-hard-rtl
          path: |
            source/**
            !source/artifacts/**
            !source/bin/**
            !source/obj/**
          if-no-files-found: error
          retention-days: 14
