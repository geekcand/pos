name: Build Geek POS v2.0.9 Root RTL R1 Fixed

on:
  workflow_dispatch:
  push:
    branches: [rtl-root-r1-build]
    paths:
      - ".github/workflows/build-v209-root-rtl-r1-fixed.yml"

permissions:
  contents: read
  actions: read

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - name: Download verified hard RTL source
        uses: actions/download-artifact@v4
        with:
          name: GeekPOS-Source-v2.0.9-hard-rtl
          path: source
          github-token: ${{ github.token }}
          repository: geekcand/pos
          run-id: 37176517979

      - name: Apply exact Root RTL R1 overlay
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          $root="$env:GITHUB_WORKSPACE\source"
          $names=@('chunk00.txt','chunk01.txt','chunk03.txt','chunk04.txt','chunk05.txt','chunk06.txt','chunk07.txt','chunk08.txt','chunk09.txt')
          $parts=$names | ForEach-Object { Join-Path $env:GITHUB_WORKSPACE ("patches\v209-root-rtl-r1\"+$_) }
          $b64=($parts | ForEach-Object { (Get-Content $_ -Raw).Trim() }) -join ''
          if($b64.Length -ne 39620){ throw "Overlay length mismatch: $($b64.Length)" }
          $zip=Join-Path $env:RUNNER_TEMP 'root-rtl-r1-overlay.zip'
          [IO.File]::WriteAllBytes($zip,[Convert]::FromBase64String($b64))
          $digest=(Get-FileHash $zip -Algorithm SHA256).Hash.ToLowerInvariant()
          if($digest -ne 'e094c4d5ce5b73300dfb0589ab90abd1a52b5478aeaafe7dca31eefa6a1036f9'){ throw "Overlay digest mismatch: $digest" }
          Expand-Archive -LiteralPath $zip -DestinationPath $root -Force

      - name: Apply WinUI NumberBox compatibility fix
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          $app="$env:GITHUB_WORKSPACE\source\App.xaml"
          $s=Get-Content $app -Raw
          $old='<Style TargetType="NumberBox">' + "`r`n" + '                <Setter Property="FlowDirection" Value="RightToLeft" />' + "`r`n" + '                <Setter Property="TextAlignment" Value="Right" />'
          $new='<Style TargetType="NumberBox">' + "`r`n" + '                <Setter Property="FlowDirection" Value="RightToLeft" />'
          if(!$s.Contains($old)) { throw 'Expected NumberBox style pattern missing.' }
          Set-Content $app -Value ($s.Replace($old,$new)) -Encoding utf8 -NoNewline

          $shift="$env:GITHUB_WORKSPACE\source\Pages\ShiftsPage.xaml.cs"
          $s=Get-Content $shift -Raw
          $old=', FlowDirection = FlowDirection.RightToLeft, TextAlignment = TextAlignment.Right };'
          $count=([regex]::Matches($s,[regex]::Escape($old))).Count
          if($count -ne 2) { throw "Expected 2 invalid NumberBox TextAlignment usages, found $count." }
          Set-Content $shift -Value ($s.Replace($old,', FlowDirection = FlowDirection.RightToLeft };')) -Encoding utf8 -NoNewline

      - name: Verify exact RTL R1 source
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          $r="$env:GITHUB_WORKSPACE\source"
          function T($p){ Get-Content (Join-Path $r $p) -Raw }
          function Need($ok,$msg){ if(!$ok){ throw $msg } }
          $appcs=T 'App.xaml.cs'
          Need ($appcs.Contains('ApplicationLanguages.PrimaryLanguageOverride = "ar-EG"')) 'ar-EG override missing'
          Need ($appcs.IndexOf('PrimaryLanguageOverride') -lt $appcs.IndexOf('InitializeComponent()')) 'ar-EG override too late'
          $mw=T 'MainWindow.xaml'
          Need ($mw.Contains('FlowDirection="RightToLeft" Language="ar-EG"')) 'MainWindow RTL missing'
          Need ($mw.Contains('RootFrame" RequestedTheme="Dark" FlowDirection="RightToLeft" Language="ar-EG"')) 'RootFrame RTL missing'
          foreach($p in @('AdminPage.xaml','CategoriesPage.xaml','ProductsPage.xaml','PaymentMethodsPage.xaml','UsersPage.xaml','ReportsPage.xaml','ShiftsPage.xaml','ReceiptDesignerPage.xaml','ExpensesPage.xaml','RefundsPage.xaml','AuditPage.xaml','OnlinePage.xaml','SettingsPage.xaml','PosPage.xaml','ShellPage.xaml','AboutPage.xaml')){
            $x=T ("Pages\"+$p)
            Need ($x.Contains('Language="ar-EG"')) "$p language missing"
            Need ($x.Contains('FlowDirection="RightToLeft"')) "$p RTL missing"
          }
          foreach($p in @('CategoriesPage.xaml','ProductsPage.xaml','PaymentMethodsPage.xaml','UsersPage.xaml','ShiftsPage.xaml','ExpensesPage.xaml','RefundsPage.xaml','AuditPage.xaml')){
            $x=T ("Pages\"+$p)
            Need ($x -match '<Grid[^>]*Background="\{StaticResource AppBackgroundBrush\}"[^>]*FlowDirection="RightToLeft"') "$p surface still LTR"
          }
          Need ((T 'Pages\ReportsPage.xaml').Contains('<StackPanel Padding="24" Spacing="16" FlowDirection="RightToLeft" HorizontalAlignment="Stretch">')) 'Reports content still LTR'
          $pos=T 'Pages\PosPage.xaml'
          Need ($pos.Contains('<Grid Grid.Row="1" ColumnSpacing="0" FlowDirection="LeftToRight">')) 'POS physical layout flipped'
          $about=T 'Pages\AboutPage.xaml'
          Need ($about.Contains('نسخة اختبار RTL: R1 • 04-10-2026')) 'R1 marker missing'
          $app=T 'App.xaml'
          Need (!($app -match '<Style TargetType="NumberBox">[\s\S]*?<Setter Property="TextAlignment" Value="Right"')) 'Invalid NumberBox TextAlignment style remains'
          $shiftcs=T 'Pages\ShiftsPage.xaml.cs'
          Need (!($shiftcs.Contains('NumberBox') -and $shiftcs.Contains('TextAlignment = TextAlignment.Right'))) 'Invalid NumberBox C# TextAlignment remains'
          foreach($s in @('بدأت:','رصيد افتتاحي:','مبيعات:','كاش:','مصروفات:','مرتجعات:')){ Need ($shiftcs.Contains($s)) "Shift detail missing: $s" }
          Write-Host 'Root RTL R1 Fixed verification passed.'

      - name: Verify licensing helper
        shell: pwsh
        run: |
          $out=Join-Path $env:GITHUB_WORKSPACE 'activation-diagnostic.txt'
          & "$env:GITHUB_WORKSPACE\source\InstallerTools\GeekPOS-Activate.ps1" -Serial 'GEEK-TEST-INVALID-0000' -OutFile $out
          if((Get-Content $out -Raw).Trim() -ne 'ERR|REJECTED'){ throw 'Licensing helper changed.' }

      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: source/global.json

      - name: Install Inno Setup
        shell: pwsh
        run: choco install innosetup -y --no-progress

      - name: Build app and installer
        shell: pwsh
        working-directory: source
        run: ./build.ps1

      - name: Stage setup
        shell: pwsh
        run: |
          $built="$env:GITHUB_WORKSPACE\source\artifacts\installer-fixed\GeekPOS-Setup-x64-v2.0.9.exe"
          if(!(Test-Path $built)){ throw 'Setup exe missing' }
          New-Item -ItemType Directory -Force "$env:GITHUB_WORKSPACE\stage" | Out-Null
          Copy-Item $built "$env:GITHUB_WORKSPACE\stage\GeekPOS-Setup-x64-v2.0.9-root-rtl-r1-fixed.exe"

      - uses: actions/upload-artifact@v4
        with:
          name: GeekPOS-Setup-x64-v2.0.9-root-rtl-r1-fixed
          path: stage/GeekPOS-Setup-x64-v2.0.9-root-rtl-r1-fixed.exe
          compression-level: 0
          retention-days: 14

      - uses: actions/upload-artifact@v4
        with:
          name: GeekPOS-Source-v2.0.9-root-rtl-r1-fixed
          path: |
            source/**
            !source/artifacts/**
            !source/bin/**
            !source/obj/**
          retention-days: 14
