name: Build Geek POS v2.0.9 Root RTL R1

on:
  push:
    branches: [ rtl-root-fix-r1 ]
    paths:
      - ".github/workflows/build-v209-root-rtl-r1.yml"
      - "patches/v209-root-rtl-r1/chunks/**"
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  build-root-rtl:
    runs-on: windows-latest
    timeout-minutes: 40
    steps:
      - name: Checkout RTL fix branch
        uses: actions/checkout@v4

      - name: Download exact last tested Hard RTL source
        uses: actions/download-artifact@v4
        with:
          name: GeekPOS-Source-v2.0.9-hard-rtl
          path: source
          github-token: ${{ github.token }}
          repository: geekcand/pos
          run-id: 37176517979

      - name: Apply verified root Arabic RTL overlay
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $root = "$env:GITHUB_WORKSPACE\source"
          $chunkDir = "$env:GITHUB_WORKSPACE\patches\v209-root-rtl-r1\chunks"
          if (!(Test-Path "$root\SweetsPOS.csproj")) { throw 'Hard RTL baseline source missing.' }
          $parts = 0..9 | ForEach-Object { Join-Path $chunkDir ("chunk{0:D2}.txt" -f $_) }
          foreach ($p in $parts) { if (!(Test-Path $p)) { throw "Missing overlay chunk: $p" } }
          $b64 = ($parts | ForEach-Object { (Get-Content $_ -Raw).Trim() }) -join ''
          if ($b64.Length -ne 39616) { throw "Overlay base64 length mismatch: $($b64.Length)" }
          $zip = Join-Path $env:RUNNER_TEMP 'root-rtl-r1.zip'
          [IO.File]::WriteAllBytes($zip, [Convert]::FromBase64String($b64))
          $digest = (Get-FileHash $zip -Algorithm SHA256).Hash.ToLowerInvariant()
          if ($digest -ne 'ff47cb3dc99cf633c1bf2310c8a9b2ca93369c5943e20c568c879680698541c6') { throw "Decoded overlay digest mismatch: $digest" }
          $before = @{}
          Get-ChildItem $root -Recurse -File | ForEach-Object { $rel=$_.FullName.Substring($root.Length+1); $before[$rel]=(Get-FileHash $_.FullName -Algorithm SHA256).Hash }
          Expand-Archive -LiteralPath $zip -DestinationPath $root -Force
          $allowed = @('App.xaml','App.xaml.cs','MainWindow.xaml','Pages\OnlinePage.xaml','Pages\ShiftsPage.xaml.cs','Pages\PaymentMethodsPage.xaml','Pages\ExpensesPage.xaml','Pages\UsersPage.xaml','Pages\SettingsPage.xaml','Pages\AboutPage.xaml','Pages\ShellPage.xaml','Pages\ProductsPage.xaml','Pages\AuditPage.xaml','Pages\PosPage.xaml','Pages\AdminPage.xaml','Pages\ShiftsPage.xaml','Pages\RefundsPage.xaml','Pages\ReceiptDesignerPage.xaml','Pages\ReportsPage.xaml','Pages\CategoriesPage.xaml')
          $changed=@()
          Get-ChildItem $root -Recurse -File | ForEach-Object { $rel=$_.FullName.Substring($root.Length+1); $hash=(Get-FileHash $_.FullName -Algorithm SHA256).Hash; if(!$before.ContainsKey($rel) -or $before[$rel] -ne $hash){$changed+=$rel} }
          $unexpected=@($changed|Where-Object{$_ -notin $allowed})
          if($unexpected.Count){throw "Unexpected changed files: $($unexpected -join ', ')"}
          if($changed.Count -ne 20){throw "Expected exactly 20 reviewed files, got $($changed.Count): $($changed -join ', ')"}
          Write-Host 'Decoded overlay SHA256 verified and exactly 20 reviewed files changed.'

      - name: Apply WinUI NumberBox compatibility fix
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          $appPath="$env:GITHUB_WORKSPACE\source\App.xaml"
          $app=Get-Content $appPath -Raw
          $app=[regex]::Replace($app,'(<Style TargetType="NumberBox">\s*<Setter Property="FlowDirection" Value="RightToLeft" />)\s*<Setter Property="TextAlignment" Value="Right" />','$1',1)
          Set-Content -Path $appPath -Value $app -Encoding utf8
          $shiftPath="$env:GITHUB_WORKSPACE\source\Pages\ShiftsPage.xaml.cs"
          $shift=Get-Content $shiftPath -Raw
          $shift=$shift.Replace(', TextAlignment = TextAlignment.Right };',' };')
          Set-Content -Path $shiftPath -Value $shift -Encoding utf8
          if((Get-Content $appPath -Raw) -match '<Style TargetType="NumberBox">[\s\S]*?<Setter Property="TextAlignment"'){throw 'Unsupported NumberBox TextAlignment still present.'}
          if((Get-Content $shiftPath -Raw).Contains('NumberBox {') -and (Get-Content $shiftPath -Raw).Contains('NumberBox') -and (Get-Content $shiftPath -Raw) -match 'new NumberBox \{[^\r\n]*TextAlignment'){throw 'Unsupported NumberBox TextAlignment still present in code.'}
          Write-Host 'Removed only unsupported NumberBox TextAlignment properties; RTL flow/header behavior retained.'

      - name: Verify Arabic language and real root RTL
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          $r="$env:GITHUB_WORKSPACE\source"
          function T($p){ Get-Content (Join-Path $r $p) -Raw }
          function Need($ok,$msg){ if(!$ok){ throw $msg } }
          $appcs=T 'App.xaml.cs'
          Need ($appcs.Contains('Windows.Globalization.ApplicationLanguages.PrimaryLanguageOverride = "ar-EG";')) 'ar-EG language override missing.'
          Need ($appcs.IndexOf('PrimaryLanguageOverride') -lt $appcs.IndexOf('InitializeComponent();')) 'ar-EG override must run before InitializeComponent.'
          $mw=T 'MainWindow.xaml'; Need ($mw.Contains('FlowDirection="RightToLeft" Language="ar-EG"')) 'MainWindow root RTL/ar-EG missing.'
          $app=T 'App.xaml'; Need ($app.Contains('RtlFieldHeaderTemplate')) 'RTL field header template missing.'; Need ($app.Contains('<Style TargetType="ComboBoxItem">')) 'ComboBox popup RTL style missing.'; Need ($app.Contains('<Style TargetType="MenuFlyoutItem">')) 'Flyout RTL style missing.'
          foreach($p in @('CategoriesPage.xaml','ProductsPage.xaml','PaymentMethodsPage.xaml','UsersPage.xaml','ShiftsPage.xaml','ReceiptDesignerPage.xaml','ExpensesPage.xaml','RefundsPage.xaml','AuditPage.xaml','OnlinePage.xaml','SettingsPage.xaml','ReportsPage.xaml')) { $x=T ("Pages\"+$p); Need ($x.Contains('FlowDirection="RightToLeft"')) "$p RTL missing."; Need ($x.Contains('Language="ar-EG"')) "$p ar-EG missing." }
          $shell=T 'Pages\ShellPage.xaml'; Need ($shell.Contains('Text="لوحة الإدارة"')) 'Admin sidebar heading missing.'; Need ($shell.Contains('TextAlignment="Right"')) 'Admin right alignment missing.'
          $shiftcs=T 'Pages\ShiftsPage.xaml.cs'; foreach($line in @('بدأت:','رصيد افتتاحي:','مبيعات:','كاش:','مصروفات:','مرتجعات:','المتوقع:')){Need($shiftcs.Contains($line)) "Shift vertical detail missing: $line"}
          $receipt=T 'Pages\ReceiptDesignerPage.xaml'; foreach($txt in @('تصميم الفاتورة','بيانات المؤسسة على الفاتورة','الشعار','الباركود / QR','عناوين جدول الفاتورة','خيارات العرض')){Need($receipt.Contains($txt)) "Receipt section missing: $txt"}
          $pos=T 'Pages\PosPage.xaml'; Need($pos.Contains('<Grid Grid.Row="1" ColumnSpacing="0" FlowDirection="LeftToRight">')) 'POS physical columns flipped.'; Need($pos.Contains('<ColumnDefinition Width="360"/><ColumnDefinition Width="*"/><ColumnDefinition Width="245"/>')) 'POS columns changed.'; foreach($txt in @('الفاتورة الحالية','اختر صنفًا لإضافته إلى الفاتورة','الأصناف','اضغط على الصنف لإضافته','الأقسام')){Need($pos.Contains($txt)) "POS heading missing: $txt"}; Need($pos.Contains('x:Name="CategoriesPanel"') -and $pos.Contains('FlowDirection="RightToLeft"')) 'POS categories RTL missing.'
          $about=T 'Pages\AboutPage.xaml'; Need($about.Contains('نسخة اختبار RTL: R1 • 04-10-2026')) 'Visible R1 marker missing.'
          Write-Host 'Arabic language, root RTL, requested pages, shifts, receipt designer and POS structure verified.'

      - name: Verify licensing helper unchanged
        shell: pwsh
        run: |
          $out=Join-Path $env:GITHUB_WORKSPACE 'activation-diagnostic.txt'
          & "$env:GITHUB_WORKSPACE\source\InstallerTools\GeekPOS-Activate.ps1" -Serial 'GEEK-TEST-INVALID-0000' -OutFile $out
          if((Get-Content $out -Raw).Trim() -ne 'ERR|REJECTED'){ throw 'Licensing helper changed.' }

      - name: Setup .NET 10 SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.401'

      - name: Install Inno Setup 6
        shell: pwsh
        run: choco install innosetup -y --no-progress

      - name: Build exact R1 source
        shell: pwsh
        working-directory: source
        run: |
          Set-ExecutionPolicy -Scope Process Bypass -Force
          .\build.ps1

      - name: Stage unmistakable R1 setup
        shell: pwsh
        run: |
          $built="$env:GITHUB_WORKSPACE\source\artifacts\installer-fixed\GeekPOS-Setup-x64-v2.0.9.exe"
          if(!(Test-Path $built)){throw 'Built setup missing.'}
          $stage="$env:GITHUB_WORKSPACE\source\artifacts\root-rtl-r1"
          New-Item -ItemType Directory -Force -Path $stage|Out-Null
          Copy-Item $built (Join-Path $stage 'GeekPOS-Setup-x64-v2.0.9-ROOT-RTL-R1.exe') -Force

      - name: Upload R1 setup
        uses: actions/upload-artifact@v4
        with:
          name: GeekPOS-Setup-x64-v2.0.9-ROOT-RTL-R1
          path: source/artifacts/root-rtl-r1/GeekPOS-Setup-x64-v2.0.9-ROOT-RTL-R1.exe
          if-no-files-found: error
          compression-level: 0
          retention-days: 14

      - name: Upload exact R1 source
        uses: actions/upload-artifact@v4
        with:
          name: GeekPOS-Source-v2.0.9-ROOT-RTL-R1
          path: |
            source/**
            !source/artifacts/**
            !source/bin/**
            !source/obj/**
          if-no-files-found: error
          retention-days: 14
