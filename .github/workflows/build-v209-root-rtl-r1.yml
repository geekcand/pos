name: Build Geek POS v2.0.9 Root RTL R1

on:
  workflow_dispatch:
  push:
    branches: [rtl-root-r1-build]
    paths:
      - ".github/workflows/build-v209-root-rtl-r1.yml"

permissions:
  contents: read
  actions: read

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - name: Download verified hard RTL source
        uses: actions/download-artifact@v4
        with:
          name: GeekPOS-Source-v2.0.9-hard-rtl
          path: source
          github-token: ${{ github.token }}
          repository: geekcand/pos
          run-id: 37176517979

      - name: Apply exact reviewed Root RTL R1 source overlay
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          $root="$env:GITHUB_WORKSPACE\source"
          $parts=0..9 | ForEach-Object { Join-Path $env:GITHUB_WORKSPACE ("patches\v209-root-rtl-r1\chunk{0:D2}.txt" -f $_) }
          foreach($p in $parts){ if(!(Test-Path $p)){ throw "Missing overlay part: $p" } }
          $b64=($parts | ForEach-Object { (Get-Content $_ -Raw).Trim() }) -join ''
          if($b64.Length -ne 39620){ throw "Overlay length mismatch: $($b64.Length)" }
          $zip=Join-Path $env:RUNNER_TEMP 'root-rtl-r1-overlay.zip'
          [IO.File]::WriteAllBytes($zip,[Convert]::FromBase64String($b64))
          $digest=(Get-FileHash $zip -Algorithm SHA256).Hash.ToLowerInvariant()
          if($digest -ne 'e094c4d5ce5b73300dfb0589ab90abd1a52b5478aeaafe7dca31eefa6a1036f9'){ throw "Overlay digest mismatch: $digest" }
          Expand-Archive -LiteralPath $zip -DestinationPath $root -Force
          Write-Host "Applied exact reviewed overlay: $digest"

      - name: Verify actual Root RTL R1 source
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          $r="$env:GITHUB_WORKSPACE\source"
          function T($p){ Get-Content (Join-Path $r $p) -Raw }
          function Need($ok,$msg){ if(!$ok){ throw $msg } }
          $appcs=T 'App.xaml.cs'
          Need ($appcs.Contains('ApplicationLanguages.PrimaryLanguageOverride = "ar-EG"')) 'ar-EG override missing'
          Need ($appcs.IndexOf('PrimaryLanguageOverride') -lt $appcs.IndexOf('InitializeComponent()')) 'ar-EG override is too late'
          $mw=T 'MainWindow.xaml'
          Need ($mw.Contains('FlowDirection="RightToLeft" Language="ar-EG"')) 'MainWindow RTL/language missing'
          Need ($mw.Contains('RootFrame" RequestedTheme="Dark" FlowDirection="RightToLeft" Language="ar-EG"')) 'RootFrame RTL/language missing'
          foreach($p in @('AdminPage.xaml','CategoriesPage.xaml','ProductsPage.xaml','PaymentMethodsPage.xaml','UsersPage.xaml','ReportsPage.xaml','ShiftsPage.xaml','ReceiptDesignerPage.xaml','ExpensesPage.xaml','RefundsPage.xaml','AuditPage.xaml','OnlinePage.xaml','SettingsPage.xaml','PosPage.xaml','ShellPage.xaml','AboutPage.xaml')){
            $x=T ("Pages\"+$p)
            Need ($x.Contains('FlowDirection="RightToLeft"')) "$p has no RTL root/content"
            Need ($x.Contains('Language="ar-EG"')) "$p has no Arabic language root"
          }
          foreach($p in @('CategoriesPage.xaml','ProductsPage.xaml','PaymentMethodsPage.xaml','UsersPage.xaml','ReportsPage.xaml','ShiftsPage.xaml','ExpensesPage.xaml','RefundsPage.xaml','AuditPage.xaml')){
            $x=T ("Pages\"+$p)
            Need ($x -match '<Grid[^>]*Background="\{StaticResource AppBackgroundBrush\}"[^>]*FlowDirection="RightToLeft"') "$p main surface still LTR"
          }
          $pos=T 'Pages\PosPage.xaml'
          Need ($pos.Contains('<Grid Grid.Row="1" ColumnSpacing="0" FlowDirection="LeftToRight">')) 'POS physical zones changed'
          Need ($pos.Contains('Text="الفاتورة الحالية"') -and $pos.Contains('Text="الأصناف"') -and $pos.Contains('Text="الأقسام"')) 'POS Arabic headings missing'
          $about=T 'Pages\AboutPage.xaml'
          Need ($about.Contains('نسخة اختبار RTL: R1 • 04-10-2026')) 'R1 visible marker missing'
          $shiftcs=T 'Pages\ShiftsPage.xaml.cs'
          foreach($s in @('بدأت:','رصيد افتتاحي:','مبيعات:','كاش:','مصروفات:','مرتجعات:')){ Need ($shiftcs.Contains($s)) "Shift detail missing: $s" }
          Need ((T 'Pages\ShiftsPage.xaml').Contains('Grid.Column="0" Text="{Binding StatusLabel}"')) 'Recent shifts status column fix missing'
          Write-Host 'Root RTL R1 source verification passed.'

      - name: Verify licensing helper
        shell: pwsh
        run: |
          $out=Join-Path $env:GITHUB_WORKSPACE 'activation-diagnostic.txt'
          & "$env:GITHUB_WORKSPACE\source\InstallerTools\GeekPOS-Activate.ps1" -Serial 'GEEK-TEST-INVALID-0000' -OutFile $out
          if((Get-Content $out -Raw).Trim() -ne 'ERR|REJECTED'){ throw 'Licensing helper changed.' }

      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: source/global.json

      - name: Install Inno Setup
        shell: pwsh
        run: choco install innosetup -y --no-progress

      - name: Build app and installer
        shell: pwsh
        working-directory: source
        run: ./build.ps1

      - name: Stage setup
        shell: pwsh
        run: |
          $built="$env:GITHUB_WORKSPACE\source\artifacts\installer-fixed\GeekPOS-Setup-x64-v2.0.9.exe"
          if(!(Test-Path $built)){ throw 'Setup exe missing' }
          New-Item -ItemType Directory -Force "$env:GITHUB_WORKSPACE\stage" | Out-Null
          Copy-Item $built "$env:GITHUB_WORKSPACE\stage\GeekPOS-Setup-x64-v2.0.9-root-rtl-r1.exe"

      - uses: actions/upload-artifact@v4
        with:
          name: GeekPOS-Setup-x64-v2.0.9-root-rtl-r1
          path: stage/GeekPOS-Setup-x64-v2.0.9-root-rtl-r1.exe
          compression-level: 0
          retention-days: 14

      - uses: actions/upload-artifact@v4
        with:
          name: GeekPOS-Source-v2.0.9-root-rtl-r1
          path: |
            source/**
            !source/artifacts/**
            !source/bin/**
            !source/obj/**
          retention-days: 14
