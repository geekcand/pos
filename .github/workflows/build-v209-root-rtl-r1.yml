name: Build Geek POS v2.0.9 Root RTL R1

on:
  push:
    branches: [ rtl-root-fix-r1 ]
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  build-root-rtl:
    runs-on: windows-latest
    timeout-minutes: 40
    steps:
      - name: Checkout RTL fix branch
        uses: actions/checkout@v4

      - name: Download exact last tested Hard RTL source
        uses: actions/download-artifact@v4
        with:
          name: GeekPOS-Source-v2.0.9-hard-rtl
          path: source
          github-token: ${{ github.token }}
          repository: geekcand/pos
          run-id: 37176517979

      - name: Apply root Arabic RTL overlay
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $root = "$env:GITHUB_WORKSPACE\source"
          $overlay = "$env:GITHUB_WORKSPACE\patches\v209-root-rtl-r1\overlay.zip"
          if (!(Test-Path "$root\SweetsPOS.csproj")) { throw 'Hard RTL baseline source missing.' }
          if (!(Test-Path $overlay)) { throw 'RTL overlay missing.' }
          $digest = (Get-FileHash $overlay -Algorithm SHA256).Hash.ToLowerInvariant()
          if ($digest -ne 'ff9d8feb769930992894f1a64a99647e56c031c33c7c9f5ec2f891f66f1279b1') { throw "Overlay digest mismatch: $digest" }

          $before = @{}
          Get-ChildItem $root -Recurse -File | ForEach-Object {
            $rel = $_.FullName.Substring($root.Length + 1)
            $before[$rel] = (Get-FileHash $_.FullName -Algorithm SHA256).Hash
          }

          Expand-Archive -LiteralPath $overlay -DestinationPath $root -Force

          $allowed = @(
            'App.xaml','App.xaml.cs','MainWindow.xaml',
            'Pages\OnlinePage.xaml','Pages\ShiftsPage.xaml.cs','Pages\PaymentMethodsPage.xaml','Pages\ExpensesPage.xaml',
            'Pages\UsersPage.xaml','Pages\SettingsPage.xaml','Pages\AboutPage.xaml','Pages\ShellPage.xaml','Pages\ProductsPage.xaml',
            'Pages\AuditPage.xaml','Pages\PosPage.xaml','Pages\AdminPage.xaml','Pages\ShiftsPage.xaml','Pages\RefundsPage.xaml',
            'Pages\ReceiptDesignerPage.xaml','Pages\ReportsPage.xaml','Pages\CategoriesPage.xaml'
          )
          $changed = @()
          Get-ChildItem $root -Recurse -File | ForEach-Object {
            $rel = $_.FullName.Substring($root.Length + 1)
            $hash = (Get-FileHash $_.FullName -Algorithm SHA256).Hash
            if (!$before.ContainsKey($rel) -or $before[$rel] -ne $hash) { $changed += $rel }
          }
          $unexpected = @($changed | Where-Object { $_ -notin $allowed })
          if ($unexpected.Count) { throw "Unexpected changed files: $($unexpected -join ', ')" }
          if ($changed.Count -ne 20) { throw "Expected exactly 20 reviewed files, got $($changed.Count): $($changed -join ', ')" }
          Write-Host "Reviewed overlay changed exactly 20 files."

      - name: Verify Arabic language and real root RTL
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          $r="$env:GITHUB_WORKSPACE\source"
          function T($p){ Get-Content (Join-Path $r $p) -Raw }
          function Need($ok,$msg){ if(!$ok){ throw $msg } }

          $appcs=T 'App.xaml.cs'
          Need ($appcs.Contains('Windows.Globalization.ApplicationLanguages.PrimaryLanguageOverride = "ar-EG";')) 'ar-EG PrimaryLanguageOverride missing.'
          Need ($appcs.IndexOf('PrimaryLanguageOverride') -lt $appcs.IndexOf('InitializeComponent();')) 'Language override must run before InitializeComponent.'

          $mw=T 'MainWindow.xaml'
          Need ($mw.Contains('FlowDirection="RightToLeft" Language="ar-EG"')) 'MainWindow root is not Arabic RTL.'

          $app=T 'App.xaml'
          Need ($app.Contains('<Style TargetType="TextBox">') -and $app.Contains('<Setter Property="HeaderTemplate" Value="{StaticResource RtlFieldHeaderTemplate}" />')) 'Global field RTL/header template missing.'
          Need ($app.Contains('<Style TargetType="ComboBoxItem">') -and $app.Contains('<Setter Property="HorizontalContentAlignment" Value="Right" />')) 'ComboBox popup item RTL alignment missing.'
          Need ($app.Contains('<Style TargetType="MenuFlyoutItem">')) 'Flyout RTL style missing.'

          $outer = @{
            'Pages\CategoriesPage.xaml' = 'Padding="24" RowSpacing="14" FlowDirection="RightToLeft"'
            'Pages\ProductsPage.xaml' = 'Padding="24" RowSpacing="14" FlowDirection="RightToLeft"'
            'Pages\PaymentMethodsPage.xaml' = 'Padding="24" RowSpacing="14" FlowDirection="RightToLeft"'
            'Pages\UsersPage.xaml' = 'Padding="24" RowSpacing="14" FlowDirection="RightToLeft"'
            'Pages\ShiftsPage.xaml' = 'Padding="24" RowSpacing="16" FlowDirection="RightToLeft"'
            'Pages\ReceiptDesignerPage.xaml' = 'Padding="24" RowSpacing="16" FlowDirection="RightToLeft"'
            'Pages\ExpensesPage.xaml' = 'Padding="24" RowSpacing="14" FlowDirection="RightToLeft"'
            'Pages\RefundsPage.xaml' = 'Padding="24" RowSpacing="14" FlowDirection="RightToLeft"'
            'Pages\AuditPage.xaml' = 'Padding="24" RowSpacing="14" FlowDirection="RightToLeft"'
            'Pages\OnlinePage.xaml' = 'Padding="24" Spacing="16" HorizontalAlignment="Stretch" FlowDirection="RightToLeft"'
            'Pages\SettingsPage.xaml' = 'Padding="24" Spacing="16" HorizontalAlignment="Stretch" FlowDirection="RightToLeft"'
            'Pages\ReportsPage.xaml' = 'Padding="24" Spacing="16" FlowDirection="RightToLeft" HorizontalAlignment="Stretch"'
          }
          foreach($p in $outer.Keys){ $x=T $p; Need ($x.Contains($outer[$p])) "$p outer layout is not RTL"; Need ($x.Contains('Language="ar-EG"')) "$p missing ar-EG language" }

          $shell=T 'Pages\ShellPage.xaml'
          Need ($shell.Contains('Text="لوحة الإدارة"') -and $shell.Contains('HorizontalAlignment="Stretch"')) 'Admin sidebar heading is not physically right-aligned.'
          Need ($shell.Contains('TextAlignment="Right"')) 'Admin sidebar text alignment missing.'

          $shifts=T 'Pages\ShiftsPage.xaml'; $shiftcs=T 'Pages\ShiftsPage.xaml.cs'
          Need ($shifts.Contains('x:Name="CurrentTitle"') -and $shifts.Contains('HorizontalAlignment="Stretch"')) 'Current shift title does not span/right-align.'
          Need ($shifts.Contains('Text="آخر الورديات"') -and $shifts.Contains('HorizontalAlignment="Stretch"')) 'Recent shifts heading not right-aligned.'
          foreach($line in @('بدأت:','رصيد افتتاحي:','مبيعات:','كاش:','مصروفات:','مرتجعات:')) { Need ($shiftcs.Contains($line)) "Shift vertical line missing: $line" }

          $receipt=T 'Pages\ReceiptDesignerPage.xaml'
          foreach($txt in @('تصميم الفاتورة','بيانات المؤسسة على الفاتورة','الشعار','الباركود / QR','عناوين جدول الفاتورة','خيارات العرض')) { Need ($receipt.Contains("Text=`"$txt`"")) "Receipt section missing: $txt" }

          $pos=T 'Pages\PosPage.xaml'
          Need ($pos.Contains('<Grid Grid.Row="1" ColumnSpacing="0" FlowDirection="LeftToRight">')) 'POS physical three-column structure must remain LTR.'
          Need ($pos.Contains('<ColumnDefinition Width="360"/><ColumnDefinition Width="*"/><ColumnDefinition Width="245"/>')) 'POS cart/products/categories widths changed.'
          foreach($txt in @('الفاتورة الحالية','اختر صنفًا لإضافته إلى الفاتورة','الأصناف','اضغط على الصنف لإضافته','الأقسام')) { Need ($pos.Contains("Text=`"$txt`"")) "POS RTL heading missing: $txt" }
          Need ($pos.Contains('x:Name="CategoriesPanel"') -and $pos.Contains('FlowDirection="RightToLeft"')) 'POS categories panel not RTL.'

          $about=T 'Pages\AboutPage.xaml'
          Need ($about.Contains('نسخة اختبار RTL: R1 • 04-10-2026')) 'Visible R1 build marker missing.'
          Write-Host 'Arabic language + root RTL + requested UI checks passed.'

      - name: Verify licensing helper unchanged
        shell: pwsh
        run: |
          $out=Join-Path $env:GITHUB_WORKSPACE 'activation-diagnostic.txt'
          & "$env:GITHUB_WORKSPACE\source\InstallerTools\GeekPOS-Activate.ps1" -Serial 'GEEK-TEST-INVALID-0000' -OutFile $out
          if((Get-Content $out -Raw).Trim() -ne 'ERR|REJECTED'){ throw 'Licensing helper changed.' }

      - name: Setup .NET 10 SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.401'

      - name: Install Inno Setup 6
        shell: pwsh
        run: choco install innosetup -y --no-progress

      - name: Build exact R1 source
        shell: pwsh
        working-directory: source
        run: |
          Set-ExecutionPolicy -Scope Process Bypass -Force
          .\build.ps1

      - name: Stage unmistakable R1 setup
        shell: pwsh
        run: |
          $built="$env:GITHUB_WORKSPACE\source\artifacts\installer-fixed\GeekPOS-Setup-x64-v2.0.9.exe"
          if(!(Test-Path $built)){ throw 'Built setup missing.' }
          $stage="$env:GITHUB_WORKSPACE\source\artifacts\root-rtl-r1"
          New-Item -ItemType Directory -Force -Path $stage | Out-Null
          Copy-Item $built (Join-Path $stage 'GeekPOS-Setup-x64-v2.0.9-ROOT-RTL-R1.exe') -Force

      - name: Upload R1 setup
        uses: actions/upload-artifact@v4
        with:
          name: GeekPOS-Setup-x64-v2.0.9-ROOT-RTL-R1
          path: source/artifacts/root-rtl-r1/GeekPOS-Setup-x64-v2.0.9-ROOT-RTL-R1.exe
          if-no-files-found: error
          compression-level: 0
          retention-days: 14

      - name: Upload exact R1 source
        uses: actions/upload-artifact@v4
        with:
          name: GeekPOS-Source-v2.0.9-ROOT-RTL-R1
          path: |
            source/**
            !source/artifacts/**
            !source/bin/**
            !source/obj/**
          if-no-files-found: error
          retention-days: 14
