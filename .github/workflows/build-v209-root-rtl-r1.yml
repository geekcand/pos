name: Build Geek POS v2.0.9 Root RTL R2

on:
  push:
    branches: [ rtl-root-fix-r1 ]
    paths:
      - ".github/workflows/build-v209-root-rtl-r1.yml"
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  build-root-rtl-r2:
    runs-on: windows-latest
    timeout-minutes: 40
    steps:
      - name: Checkout RTL fix branch
        uses: actions/checkout@v4

      - name: Download exact R1 source
        uses: actions/download-artifact@v4
        with:
          name: GeekPOS-Source-v2.0.9-ROOT-RTL-R1
          path: source
          github-token: ${{ github.token }}
          repository: geekcand/pos
          run-id: 37179091987

      - name: Apply startup hotfix without reverting RTL
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          $r="$env:GITHUB_WORKSPACE\source"
          $appPath=Join-Path $r 'App.xaml.cs'
          $app=Get-Content $appPath -Raw
          $old='Windows.Globalization.ApplicationLanguages.PrimaryLanguageOverride = "ar-EG";'
          if(!$app.Contains($old)){ throw 'Expected risky Windows.Globalization override not found in R1 source.' }
          $app=$app.Replace($old,'// Unpackaged WinUI: Arabic direction is controlled by XAML Language/FlowDirection; no Windows.Globalization override at startup.')
          Set-Content -Path $appPath -Value $app -Encoding utf8

          $aboutPath=Join-Path $r 'Pages\AboutPage.xaml'
          $about=Get-Content $aboutPath -Raw
          $about=$about.Replace('نسخة اختبار RTL: R1 • 04-10-2026','نسخة اختبار RTL: R2 • 04-10-2026')
          Set-Content -Path $aboutPath -Value $about -Encoding utf8

          Write-Host 'Removed only unpackaged startup language override; RTL XAML remains intact.'

      - name: Verify startup-safe RTL source
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          $r="$env:GITHUB_WORKSPACE\source"
          function T($p){ Get-Content (Join-Path $r $p) -Raw }
          function Need($ok,$msg){ if(!$ok){ throw $msg } }
          $appcs=T 'App.xaml.cs'
          Need (!$appcs.Contains('Windows.Globalization.ApplicationLanguages.PrimaryLanguageOverride')) 'Risky Windows.Globalization override still present.'
          $mw=T 'MainWindow.xaml'
          Need ($mw.Contains('FlowDirection="RightToLeft" Language="ar-EG"')) 'MainWindow RTL/ar-EG missing.'
          foreach($p in @('CategoriesPage.xaml','ProductsPage.xaml','PaymentMethodsPage.xaml','UsersPage.xaml','ShiftsPage.xaml','ReceiptDesignerPage.xaml','ExpensesPage.xaml','RefundsPage.xaml','AuditPage.xaml','OnlinePage.xaml','SettingsPage.xaml','ReportsPage.xaml')) {
            $x=T ("Pages\"+$p)
            Need ($x.Contains('FlowDirection="RightToLeft"')) "$p RTL missing."
            Need ($x.Contains('Language="ar-EG"')) "$p ar-EG missing."
          }
          $pos=T 'Pages\PosPage.xaml'
          Need ($pos.Contains('<Grid Grid.Row="1" ColumnSpacing="0" FlowDirection="LeftToRight">')) 'POS physical layout changed.'
          Need ($pos.Contains('<ColumnDefinition Width="360"/><ColumnDefinition Width="*"/><ColumnDefinition Width="245"/>')) 'POS columns changed.'
          $about=T 'Pages\AboutPage.xaml'
          Need ($about.Contains('نسخة اختبار RTL: R2 • 04-10-2026')) 'R2 marker missing.'
          Write-Host 'Startup-safe RTL R2 verification passed.'

      - name: Verify licensing helper unchanged
        shell: pwsh
        run: |
          $out=Join-Path $env:GITHUB_WORKSPACE 'activation-diagnostic.txt'
          & "$env:GITHUB_WORKSPACE\source\InstallerTools\GeekPOS-Activate.ps1" -Serial 'GEEK-TEST-INVALID-0000' -OutFile $out
          if((Get-Content $out -Raw).Trim() -ne 'ERR|REJECTED'){ throw 'Licensing helper changed.' }

      - name: Setup .NET 10 SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.401'

      - name: Install Inno Setup 6
        shell: pwsh
        run: choco install innosetup -y --no-progress

      - name: Build R2 hotfix
        shell: pwsh
        working-directory: source
        run: |
          Set-ExecutionPolicy -Scope Process Bypass -Force
          .\build.ps1

      - name: Stage R2 setup
        shell: pwsh
        run: |
          $built="$env:GITHUB_WORKSPACE\source\artifacts\installer-fixed\GeekPOS-Setup-x64-v2.0.9.exe"
          if(!(Test-Path $built)){throw 'Built setup missing.'}
          $stage="$env:GITHUB_WORKSPACE\source\artifacts\root-rtl-r2"
          New-Item -ItemType Directory -Force -Path $stage|Out-Null
          Copy-Item $built (Join-Path $stage 'GeekPOS-Setup-x64-v2.0.9-ROOT-RTL-R2.exe') -Force
          Get-FileHash (Join-Path $stage 'GeekPOS-Setup-x64-v2.0.9-ROOT-RTL-R2.exe') -Algorithm SHA256

      - name: Upload R2 setup
        uses: actions/upload-artifact@v4
        with:
          name: GeekPOS-Setup-x64-v2.0.9-ROOT-RTL-R2
          path: source/artifacts/root-rtl-r2/GeekPOS-Setup-x64-v2.0.9-ROOT-RTL-R2.exe
          if-no-files-found: error
          compression-level: 0
          retention-days: 14

      - name: Upload exact R2 source
        uses: actions/upload-artifact@v4
        with:
          name: GeekPOS-Source-v2.0.9-ROOT-RTL-R2
          path: |
            source/**
            !source/artifacts/**
            !source/bin/**
            !source/obj/**
          if-no-files-found: error
          retention-days: 14
