name: Build Geek POS v2.0.9 RTL Multi-Branch v2

on:
  push:
    branches: [ main ]
    paths:
      - ".github/workflows/build-v209-rtl-multibranch-v2.yml"
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 40
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download verified v2.0.9 UI Final source
        uses: actions/download-artifact@v4
        with:
          name: GeekPOS-Source-v2.0.9-ui-final
          path: source
          github-token: ${{ github.token }}
          repository: geekcand/pos
          run-id: 37170456560

      - name: Apply exact reviewed overlay
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $root = "$env:GITHUB_WORKSPACE\source"
          if (!(Test-Path "$root\SweetsPOS.csproj")) { throw 'Baseline source missing.' }
          $before = @{}
          Get-ChildItem $root -Recurse -File | ForEach-Object {
            $rel = $_.FullName.Substring($root.Length + 1)
            $before[$rel] = (Get-FileHash $_.FullName -Algorithm SHA256).Hash
          }

          $d = "$env:GITHUB_WORKSPACE\patches\v209-rtl-multibranch"
          $names = @('chunk01.txt','chunk02.txt','chunk03.txt','chunk04.txt','chunk05.txt','chunk06.txt','chunk07.txt','chunk08.txt','chunk09.txt','chunk10a.txt','chunk10b.txt','chunk11.txt','chunk12.txt','chunk13.txt')
          foreach ($n in $names) { if (!(Test-Path (Join-Path $d $n))) { throw "Missing overlay part $n" } }
          $b64 = ($names | ForEach-Object { (Get-Content (Join-Path $d $_) -Raw).Trim() }) -join ''
          if ($b64.Length -ne 74756) { throw "Overlay base64 length mismatch: $($b64.Length)" }
          $zip = Join-Path $env:RUNNER_TEMP 'overlay.zip'
          [IO.File]::WriteAllBytes($zip,[Convert]::FromBase64String($b64))
          $digest = (Get-FileHash $zip -Algorithm SHA256).Hash.ToLowerInvariant()
          Write-Host "Overlay ZIP SHA256: $digest"
          Expand-Archive -LiteralPath $zip -DestinationPath $root -Force

          $allowed = @(
            'OnlineDashboard\index.html','Pages\AboutPage.xaml.cs','Pages\OnlinePage.xaml','Pages\ShiftsPage.xaml.cs','Pages\PageHelpers.cs',
            'Pages\PaymentMethodsPage.xaml','Pages\ExpensesPage.xaml','Pages\UsersPage.xaml','Pages\SettingsPage.xaml','Pages\AboutPage.xaml',
            'Pages\ShellPage.xaml','Pages\ProductsPage.xaml','Pages\AuditPage.xaml','Pages\PosPage.xaml','Pages\AdminPage.xaml','Pages\ShiftsPage.xaml',
            'Pages\RefundsPage.xaml','Pages\ReceiptDesignerPage.xaml','Pages\AdminPage.xaml.cs','Pages\DashboardPage.xaml','Pages\ReportsPage.xaml',
            'Pages\ShellPage.xaml.cs','Pages\CategoriesPage.xaml'
          )
          $changed = @()
          Get-ChildItem $root -Recurse -File | ForEach-Object {
            $rel = $_.FullName.Substring($root.Length + 1)
            $hash = (Get-FileHash $_.FullName -Algorithm SHA256).Hash
            if (!$before.ContainsKey($rel) -or $before[$rel] -ne $hash) { $changed += $rel }
          }
          $unexpected = @($changed | Where-Object { $_ -notin $allowed })
          if ($unexpected.Count) { throw "Unexpected files changed: $($unexpected -join ', ')" }
          if ($changed.Count -lt 20) { throw "Reviewed overlay incomplete; only $($changed.Count) files changed." }
          Write-Host "Only approved files changed ($($changed.Count))."

      - name: Verify RTL About cloud and branches
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          $r="$env:GITHUB_WORKSPACE\source"
          function T($p){ Get-Content (Join-Path $r $p) -Raw }
          function N($x,$m){ if(!$x){ throw $m } }

          $about=T 'Pages\AboutPage.xaml'
          N ($about.Contains('حول Geek POS')) 'About missing'
          N ($about.Contains('إدارة أبسط • متابعة أوضح • بيع أسرع')) 'About slogan missing'
          N ($about.Contains('عرض إجمالي مبيعات كل الفروع')) 'About branches feature missing'
          N ($about.Contains('01555301042')) 'About contact missing'

          $shell=T 'Pages\ShellPage.xaml'; $shellcs=T 'Pages\ShellPage.xaml.cs'
          N ($shell.Contains('AboutNav')) 'About nav missing'
          N (($shell.Contains('HorizontalContentAlignment="Right"')) -or ($shell.Contains('Property="HorizontalContentAlignment" Value="Right"'))) 'Admin navigation not right aligned'
          N ($shellcs.Contains('AboutPage')) 'About route missing'

          foreach($p in @('Pages\AdminPage.xaml','Pages\CategoriesPage.xaml','Pages\ProductsPage.xaml','Pages\PaymentMethodsPage.xaml','Pages\UsersPage.xaml','Pages\ReportsPage.xaml','Pages\ExpensesPage.xaml','Pages\RefundsPage.xaml','Pages\AuditPage.xaml','Pages\SettingsPage.xaml','Pages\OnlinePage.xaml')){
            $x=T $p; N ($x.Contains('FlowDirection="RightToLeft"')) "$p is not RTL"
          }

          $s=T 'Pages\ShiftsPage.xaml.cs'; N ($s.Contains('رصيد افتتاحي:')) 'Shift opening line missing'; N ($s.Contains('مرتجعات:')) 'Shift refunds line missing'
          $receipt=T 'Pages\ReceiptDesignerPage.xaml'; N ($receipt.Contains('FlowDirection="RightToLeft"')) 'Receipt designer not RTL'; N ($receipt.Contains('TextAlignment="Right"')) 'Receipt designer not right aligned'

          $online=T 'Pages\OnlinePage.xaml'
          foreach($id in @('SupabaseUrl','AnonKey','OnlineEmail','OnlinePassword','StoreId')){ N ($online.Contains("x:Name=`"$id`"")) "Cloud field $id missing" }
          N ($online.Contains('MAKKAH-1')) 'Branch example missing'
          N (!$online.Contains('x:Name="SupabaseUrl" Visibility="Collapsed"')) 'Cloud URL hidden'
          N (!$online.Contains('x:Name="AnonKey" Visibility="Collapsed"')) 'Cloud key hidden'

          $dash=T 'OnlineDashboard\index.html'
          N ($dash.Contains("const ALL_STORES='__ALL__'")) 'ALL mode missing'
          N ($dash.Contains('كل الفروع — ALL')) 'ALL selector missing'
          N ($dash.Contains('buildAllPayload')) 'ALL aggregation missing'
          N ($dash.Contains('reportDaysForDisplay')) 'ALL reports missing'
          N ($dash.Contains('اختر الفرع للإغلاق')) 'ALL shift-close guard missing'

          $pos=T 'Pages\PosPage.xaml'
          N ($pos -match '<ColumnDefinition Width="360"\s*/>\s*<ColumnDefinition Width="\*"\s*/>\s*<ColumnDefinition Width="245"\s*/>') 'POS physical layout changed'
          N ($pos -match 'x:Name="QtyBox"[^>]*TextAlignment="Center"') 'Quantity is not centered'
          N ($pos.Contains('Text="الفاتورة الحالية"')) 'POS invoice title missing'
          N ($pos.Contains('Text="الأصناف"')) 'POS products title missing'
          N ($pos.Contains('Text="الأقسام"')) 'POS categories title missing'

          $project=T 'SweetsPOS.csproj'; $iss=T 'installer.iss'
          N ($project.Contains('<Version>2.0.9</Version>')) 'Project version changed'
          N ($iss.Contains('MyAppVersion "2.0.9"')) 'Installer version changed'
          Write-Host 'Approved requirements verified.'

      - name: Verify licensing helper
        shell: pwsh
        run: |
          $out=Join-Path $env:GITHUB_WORKSPACE 'activation-diagnostic.txt'
          & "$env:GITHUB_WORKSPACE\source\InstallerTools\GeekPOS-Activate.ps1" -Serial 'GEEK-TEST-INVALID-0000' -OutFile $out
          if((Get-Content $out -Raw).Trim() -ne 'ERR|REJECTED'){ throw 'Licensing helper changed.' }

      - name: Setup .NET 10 SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.401'

      - name: Install Inno Setup 6
        shell: pwsh
        run: choco install innosetup -y --no-progress

      - name: Build setup
        shell: pwsh
        working-directory: source
        run: |
          Set-ExecutionPolicy -Scope Process Bypass -Force
          .\build.ps1

      - name: Stage final setup
        shell: pwsh
        run: |
          $built="$env:GITHUB_WORKSPACE\source\artifacts\installer-fixed\GeekPOS-Setup-x64-v2.0.9.exe"
          if(!(Test-Path $built)){ throw 'Built setup missing.' }
          $stage="$env:GITHUB_WORKSPACE\source\artifacts\rtl-multibranch"
          New-Item -ItemType Directory -Force -Path $stage | Out-Null
          Copy-Item $built (Join-Path $stage 'GeekPOS-Setup-x64-v2.0.9-rtl-multibranch.exe') -Force

      - name: Upload setup
        uses: actions/upload-artifact@v4
        with:
          name: GeekPOS-Setup-x64-v2.0.9-rtl-multibranch
          path: source/artifacts/rtl-multibranch/GeekPOS-Setup-x64-v2.0.9-rtl-multibranch.exe
          if-no-files-found: error
          compression-level: 0
          retention-days: 14

      - name: Upload source
        uses: actions/upload-artifact@v4
        with:
          name: GeekPOS-Source-v2.0.9-rtl-multibranch
          path: |
            source/**
            !source/artifacts/**
            !source/bin/**
            !source/obj/**
          if-no-files-found: error
          retention-days: 14
