name: Build Geek POS v2.0.9 UI Polish

on:
  push:
    branches: [ main ]
    paths:
      - ".github/workflows/build-v209-ui-polish.yml"
      - "overlays/v209-ui-polish/**"
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  build-v209-ui-polish:
    runs-on: windows-latest
    timeout-minutes: 35
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download verified v2.0.9 client-fix source
        uses: actions/download-artifact@v4
        with:
          name: GeekPOS-Source-v2.0.9-clientfix
          path: source
          github-token: ${{ github.token }}
          repository: geekcand/pos
          run-id: 37110765690

      - name: Apply screenshot-driven UI polish only
        shell: pwsh
        run: |
          if (!(Test-Path "$env:GITHUB_WORKSPACE\source\SweetsPOS.csproj")) { throw "v2.0.9 client-fix source artifact missing." }
          $root = "$env:GITHUB_WORKSPACE\source"
          $before = @{}
          Get-ChildItem $root -Recurse -File | ForEach-Object {
            $rel = $_.FullName.Substring($root.Length + 1)
            $before[$rel] = (Get-FileHash $_.FullName -Algorithm SHA256).Hash
          }

          Copy-Item "$env:GITHUB_WORKSPACE\overlays\v209-ui-polish\App.xaml" "$root\App.xaml" -Force
          Copy-Item "$env:GITHUB_WORKSPACE\overlays\v209-ui-polish\Pages\RefundsPage.xaml" "$root\Pages\RefundsPage.xaml" -Force
          Copy-Item "$env:GITHUB_WORKSPACE\overlays\v209-ui-polish\Pages\PosPage.xaml" "$root\Pages\PosPage.xaml" -Force
          Copy-Item "$env:GITHUB_WORKSPACE\overlays\v209-ui-polish\Pages\ShiftsPage.xaml" "$root\Pages\ShiftsPage.xaml" -Force
          Copy-Item "$env:GITHUB_WORKSPACE\overlays\v209-ui-polish\Pages\OnlinePage.xaml" "$root\Pages\OnlinePage.xaml" -Force
          Copy-Item "$env:GITHUB_WORKSPACE\overlays\v209-ui-polish\Pages\SettingsPage.xaml" "$root\Pages\SettingsPage.xaml" -Force

          $allowed = @(
            'App.xaml',
            'Pages\RefundsPage.xaml',
            'Pages\PosPage.xaml',
            'Pages\ShiftsPage.xaml',
            'Pages\OnlinePage.xaml',
            'Pages\SettingsPage.xaml'
          )
          $changed = New-Object System.Collections.Generic.List[string]
          Get-ChildItem $root -Recurse -File | ForEach-Object {
            $rel = $_.FullName.Substring($root.Length + 1)
            $hash = (Get-FileHash $_.FullName -Algorithm SHA256).Hash
            if (!$before.ContainsKey($rel) -or $before[$rel] -ne $hash) { $changed.Add($rel) }
          }
          $unexpected = @($changed | Where-Object { $_ -notin $allowed })
          if ($unexpected.Count -gt 0) { throw "Unexpected files changed: $($unexpected -join ', ')" }
          foreach ($required in $allowed) {
            if ($required -notin $changed) { throw "Expected UI file was not changed: $required" }
          }
          Write-Host "Only approved UI files changed: $($changed -join ', ')"

      - name: Verify exact requested UI behavior
        shell: pwsh
        run: |
          $app = Get-Content "$env:GITHUB_WORKSPACE\source\App.xaml" -Raw
          $refunds = Get-Content "$env:GITHUB_WORKSPACE\source\Pages\RefundsPage.xaml" -Raw
          $pos = Get-Content "$env:GITHUB_WORKSPACE\source\Pages\PosPage.xaml" -Raw
          $shifts = Get-Content "$env:GITHUB_WORKSPACE\source\Pages\ShiftsPage.xaml" -Raw
          $online = Get-Content "$env:GITHUB_WORKSPACE\source\Pages\OnlinePage.xaml" -Raw
          $settings = Get-Content "$env:GITHUB_WORKSPACE\source\Pages\SettingsPage.xaml" -Raw
          $project = Get-Content "$env:GITHUB_WORKSPACE\source\SweetsPOS.csproj" -Raw
          $installer = Get-Content "$env:GITHUB_WORKSPACE\source\installer.iss" -Raw

          if ($app -notmatch 'SectionTitleStyle[\s\S]*TextAlignment" Value="Right"') { throw "Section titles are not explicitly right aligned." }
          if ($app -notmatch 'SubTitleStyle[\s\S]*TextAlignment" Value="Right"') { throw "Subtitles are not explicitly right aligned." }
          if ($refunds -notmatch 'InvoiceBox[\s\S]*TextAlignment="Right"') { throw "Refund invoice search is not right aligned." }
          if ($refunds -notmatch 'SaleTitle[\s\S]*TextAlignment="Right"') { throw "Refund invoice details are not right aligned." }
          if ($pos -notmatch 'Text="قيمة الفاتورة"') { throw "Invoice value label was not updated." }
          if ($pos -notmatch 'HorizontalAlignment="Center" FlowDirection="RightToLeft"[\s\S]*x:Name="TotalText"') { throw "POS total block is not centered." }
          if ($pos -notmatch 'Text="الأصناف"[\s\S]*TextAlignment="Right"') { throw "POS products heading is not right aligned." }
          if ($pos -notmatch 'Text="الأقسام"[\s\S]*TextAlignment="Right"') { throw "POS categories heading is not right aligned." }
          if ($shifts -notmatch 'CurrentTitle[\s\S]*TextAlignment="Right"') { throw "Current shift title is not right aligned." }
          if ($shifts -notmatch 'CurrentDetails[\s\S]*TextAlignment="Right"') { throw "Current shift details are not right aligned." }
          if ($online -notmatch 'HorizontalContentAlignment="Stretch"') { throw "Cloud page does not use full-width aligned content." }
          if ($online -notmatch 'يستمر البيع[\s\S]*TextAlignment="Right"') { throw "Cloud help text is not right aligned." }
          if ($settings -notmatch 'بيانات المؤسسة والطباعة والنسخ الاحتياطي[\s\S]*TextAlignment="Right"') { throw "Settings intro is not right aligned." }
          if ($settings -notmatch 'BrandLogoPath[\s\S]*Visibility="Collapsed"') { throw "Raw logo filesystem path is still customer-visible." }
          if ($settings -notmatch 'ReceiptEncoding[\s\S]*Visibility="Collapsed"') { throw "Technical receipt encoding is still customer-visible." }
          if ($project -notmatch '<Version>2\.0\.9</Version>') { throw "Project version changed away from v2.0.9 baseline." }
          if ($installer -notmatch 'MyAppVersion "2\.0\.9"') { throw "Installer version changed away from v2.0.9 baseline." }

      - name: Verify licensing helper
        shell: pwsh
        run: |
          $out = Join-Path $env:GITHUB_WORKSPACE 'activation-diagnostic.txt'
          & "$env:GITHUB_WORKSPACE\source\InstallerTools\GeekPOS-Activate.ps1" -Serial "GEEK-TEST-INVALID-0000" -OutFile $out
          $result = (Get-Content $out -Raw).Trim()
          if ($result -ne 'ERR|REJECTED') { throw "Licensing helper changed unexpectedly: $result" }

      - name: Setup .NET 10 SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.401'

      - name: Install Inno Setup 6
        shell: pwsh
        run: choco install innosetup -y --no-progress

      - name: Build Geek POS from v2.0.9 baseline
        shell: pwsh
        working-directory: source
        run: |
          Set-ExecutionPolicy -Scope Process Bypass -Force
          .\build.ps1

      - name: Stage polished setup
        shell: pwsh
        run: |
          $built = "$env:GITHUB_WORKSPACE\source\artifacts\installer-fixed\GeekPOS-Setup-x64-v2.0.9.exe"
          if (!(Test-Path $built)) { throw "Built v2.0.9 setup missing." }
          $stage = "$env:GITHUB_WORKSPACE\source\artifacts\ui-polish"
          New-Item -ItemType Directory -Force -Path $stage | Out-Null
          Copy-Item $built (Join-Path $stage 'GeekPOS-Setup-x64-v2.0.9-ui-polish.exe') -Force

      - name: Upload polished setup
        uses: actions/upload-artifact@v4
        with:
          name: GeekPOS-Setup-x64-v2.0.9-ui-polish
          path: source/artifacts/ui-polish/GeekPOS-Setup-x64-v2.0.9-ui-polish.exe
          if-no-files-found: error
          compression-level: 0
          retention-days: 14

      - name: Upload polished v2.0.9 source
        uses: actions/upload-artifact@v4
        with:
          name: GeekPOS-Source-v2.0.9-ui-polish
          path: |
            source/**
            !source/artifacts/**
            !source/bin/**
            !source/obj/**
          if-no-files-found: error
          retention-days: 14
