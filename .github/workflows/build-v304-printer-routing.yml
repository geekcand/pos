name: Build Geek POS v3.1.3 Receipt Excel Report Layout

on:
  push:
    branches: [ v3.1.3-receipt-excel-report-layout ]
    paths:
      - ".github/workflows/build-v304-printer-routing.yml"
      - "patches/v313_apply.py"
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - name: Checkout v3.1.3 branch
        uses: actions/checkout@v4

      - name: Download verified Geek POS v3.1.2 source
        uses: actions/download-artifact@v4
        with:
          name: GeekPOS-Source-v3.1.2
          path: source
          github-token: ${{ github.token }}
          repository: geekcand/pos
          run-id: 38120035396

      - name: Apply v3.1.3 changes
        shell: pwsh
        run: |
          python "$env:GITHUB_WORKSPACE\patches\v313_apply.py" "$env:GITHUB_WORKSPACE\source"

      - name: Verify v3.1.3 requirements
        shell: pwsh
        run: |
          $root = "$env:GITHUB_WORKSPACE\source"
          $project = Get-Content "$root\GeekPOS.csproj" -Raw
          $installer = Get-Content "$root\installer.iss" -Raw
          $receipt = Get-Content "$root\Services\ReceiptService.cs" -Raw
          $excel = Get-Content "$root\Services\ExcelReportService.cs" -Raw
          $pos = Get-Content "$root\Pages\PosPage.xaml" -Raw
          $reports = Get-Content "$root\Pages\ReportsPage.xaml" -Raw

          if ($project -notmatch '<Version>3\.1\.3</Version>' -or $project -notmatch '<AssemblyVersion>3\.1\.3\.0</AssemblyVersion>') { throw "Project version is not 3.1.3." }
          if ($installer -notmatch 'MyAppVersion "3\.1\.3"' -or $installer -notmatch 'GeekPOS-Setup-x64-v3\.1\.3') { throw "Installer version is not 3.1.3." }

          if ($excel -match 'نموذج تصدير إلى Excel') { throw "Old Excel subtitle still exists." }
          foreach ($token in @('ws.Cell("A3").Value = "تقرير المبيعات";','SetMoneyText','MoneyDisplay.WithCurrency(value, group: true)','cell.Style.NumberFormat.Format = "@"')) {
            if ($excel -notmatch [regex]::Escape($token)) { throw "Excel requirement missing: $token" }
          }

          foreach ($token in @('Text="العدد"','Grid.ColumnDefinitions><ColumnDefinition Width="68"/><ColumnDefinition Width="*"/><ColumnDefinition Width="Auto"/>')) {
            if ($pos -notmatch [regex]::Escape($token)) { throw "POS quantity header/layout missing: $token" }
          }

          if ($reports -notmatch '<Grid.RowDefinitions><RowDefinition Height="Auto"/><RowDefinition Height="Auto"/></Grid.RowDefinitions>') { throw "Reports two-row filter grid missing." }
          if ($reports -notmatch 'Grid.Row="1" Grid.Column="0" Grid.ColumnSpan="4" x:Name="CustomerFilter"') { throw "Customer/mobile filter is not isolated in row 2." }

          foreach ($token in @('فاتورة #{sale.DisplayInvoiceNumber}','النوع: {orderType}','صباحاً','مساءً','الكاشير:','DrawCell(g, "القيمة"','DrawCell(g, "الكمية"','DrawCell(g, "الصنف"','DrawReferenceTotalRow(g, paymentName, -paidAmount','Powered by Geek POS','numberWidth + 5')) {
            if ($receipt -notmatch [regex]::Escape($token)) { throw "Receipt requirement missing: $token" }
          }
          if ($receipt -match 'g.DrawString\("ج\.م".*valueRect\.X') { throw "Currency is still drawn before the number." }

      - name: Parse XAML
        shell: pwsh
        run: |
          python -c "from pathlib import Path; import xml.etree.ElementTree as ET; files=list(Path(r'$env:GITHUB_WORKSPACE\source').rglob('*.xaml')); [ET.parse(p) for p in files]; print(f'Parsed {len(files)} XAML files')"

      - name: Setup .NET 10 SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.401'

      - name: Install Inno Setup 6
        shell: pwsh
        run: choco install innosetup -y --no-progress

      - name: Build Geek POS v3.1.3
        shell: pwsh
        working-directory: source
        run: |
          Set-ExecutionPolicy -Scope Process Bypass -Force
          .\build.ps1

      - name: Stage v3.1.3 setup
        shell: pwsh
        run: |
          $src = "$env:GITHUB_WORKSPACE\source\artifacts\installer-fixed\GeekPOS-Setup-x64-v3.1.3.exe"
          if (!(Test-Path $src)) { throw "v3.1.3 Setup missing." }
          $dst = "$env:GITHUB_WORKSPACE\GeekPOS-Setup-x64-v3.1.3.exe"
          Copy-Item $src $dst -Force
          Write-Host "Setup SHA256: $((Get-FileHash $dst -Algorithm SHA256).Hash)"

      - name: Upload v3.1.3 setup
        uses: actions/upload-artifact@v4
        with:
          name: GeekPOS-Setup-x64-v3.1.3
          path: GeekPOS-Setup-x64-v3.1.3.exe
          if-no-files-found: error
          compression-level: 0
          retention-days: 14

      - name: Upload v3.1.3 source
        uses: actions/upload-artifact@v4
        with:
          name: GeekPOS-Source-v3.1.3
          path: |
            source/**
            !source/artifacts/**
            !source/bin/**
            !source/obj/**
          if-no-files-found: error
          retention-days: 14
