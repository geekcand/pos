name: Build Geek POS v3.1.1 Reports Receipt Filters

on:
  push:
    branches: [ v3.1.1-reports-receipt-filters ]
    paths:
      - ".github/workflows/build-v304-printer-routing.yml"
      - "patches/v311_chunk*.txt"
      - "patches/v311_fix.patch"
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - name: Checkout v3.1.1 branch
        uses: actions/checkout@v4

      - name: Download verified Geek POS v3.1.0 source
        uses: actions/download-artifact@v4
        with:
          name: GeekPOS-Source-v3.1.0
          path: source
          github-token: ${{ github.token }}
          repository: geekcand/pos
          run-id: 38036365404

      - name: Reconstruct and apply v3.1.1 patch
        shell: pwsh
        run: |
          $b64 = ((Get-Content "$env:GITHUB_WORKSPACE\patches\v311_chunk0.txt" -Raw).Trim() +
                  (Get-Content "$env:GITHUB_WORKSPACE\patches\v311_chunk1.txt" -Raw).Trim() +
                  (Get-Content "$env:GITHUB_WORKSPACE\patches\v311_chunk2.txt" -Raw).Trim() +
                  (Get-Content "$env:GITHUB_WORKSPACE\patches\v311_chunk3.txt" -Raw).Trim())
          [IO.File]::WriteAllBytes("$env:GITHUB_WORKSPACE\v311.patch.gz", [Convert]::FromBase64String($b64))
          python -c "import gzip,pathlib; p=pathlib.Path(r'$env:GITHUB_WORKSPACE\v311.patch.gz'); pathlib.Path(r'$env:GITHUB_WORKSPACE\v311.patch').write_bytes(gzip.decompress(p.read_bytes()))"
          Push-Location "$env:GITHUB_WORKSPACE\source"
          git apply "$env:GITHUB_WORKSPACE\v311.patch"
          if ($LASTEXITCODE -ne 0) { throw "v3.1.1 patch failed." }
          git apply "$env:GITHUB_WORKSPACE\patches\v311_fix.patch"
          if ($LASTEXITCODE -ne 0) { throw "v3.1.1 refinement patch failed." }
          Pop-Location

      - name: Verify v3.1.1 report receipt and permissions
        shell: pwsh
        run: |
          $root = "$env:GITHUB_WORKSPACE\source"
          $project = Get-Content "$root\GeekPOS.csproj" -Raw
          $installer = Get-Content "$root\installer.iss" -Raw
          $receipt = Get-Content "$root\Services\ReceiptService.cs" -Raw
          $reports = Get-Content "$root\Pages\ReportsPage.xaml.cs" -Raw
          $reportsXaml = Get-Content "$root\Pages\ReportsPage.xaml" -Raw
          $reportService = Get-Content "$root\Services\ReportService.cs" -Raw
          $excel = Get-Content "$root\Services\ExcelReportService.cs" -Raw
          $printers = Get-Content "$root\Pages\PrintersPage.xaml.cs" -Raw

          if ($project -notmatch '<Version>3\.1\.1</Version>' -or $project -notmatch 'ClosedXML') { throw "v3.1.1 project/Excel dependency missing." }
          if ($installer -notmatch 'MyAppVersion "3\.1\.1"' -or $installer -notmatch 'GeekPOS-Setup-x64-v3\.1\.1') { throw "Installer version incorrect." }
          if (!(Test-Path "$root\Core\MoneyDisplay.cs") -or !(Test-Path "$root\Services\ExcelReportService.cs")) { throw "Money/Excel services missing." }

          if ($receipt -notmatch 'usableWidth = width - margin \* 2f' -or $receipt -notmatch 'MoneyDisplay\.Number\(item\.LineTotal\)') { throw "Receipt column alignment/amount formatting fix missing." }
          if ($receipt -match '\{amount:0\.00\}' -or $receipt -match '\{item\.LineTotal:0\.00\}') { throw "Forced .00 remains in rendered receipt amounts." }

          foreach ($token in @('CashierPicker','ShiftPicker','OrderTypePicker','PaymentPicker','CategoryPicker','ProductPicker','StatusPicker','InvoiceFilter','CustomerFilter','تصدير Excel')) {
            if ($reportsXaml -notmatch [regex]::Escape($token)) { throw "Report filter/UI missing: $token" }
          }
          if ($reportService -notmatch 'GetFilteredReportAsync' -or $reportService -notmatch 'ProductId' -or $reportService -notmatch 'PaymentKey') { throw "Filtered report query missing." }
          if ($reports -notmatch 'ExportSalesReportAsync' -or $reports -match '\.csv') { throw "Excel export did not replace CSV." }

          foreach ($token in @('#191D23','#D9AA4B','#F4E7C5','Segoe UI','تقرير المبيعات — نموذج تصدير إلى Excel','ApplyMoneyFormat')) {
            if ($excel -notmatch [regex]::Escape($token)) { throw "Approved Excel design missing: $token" }
          }

          if ($printers -notmatch 'AdvancedBranchCard\.Visibility' -or $printers -notmatch 'UserRole\.Administrator') { throw "Branch Hub advanced settings are not Administrator-only." }
          if ($reportsXaml -match 'AppPanelBrush') { throw "Undefined report brush remains." }
          $money = Get-Content "$root\Core\MoneyDisplay.cs" -Raw
          if ($money -notmatch 'decimal\.Truncate\(amount\) != amount' -or $money -notmatch '#,##0\.00') { throw "Conditional whole/fraction money formatting missing." }

      - name: Parse XAML
        shell: pwsh
        run: |
          python -c "from pathlib import Path; import xml.etree.ElementTree as ET; files=list(Path(r'$env:GITHUB_WORKSPACE\source').rglob('*.xaml')); [ET.parse(p) for p in files]; print(f'Parsed {len(files)} XAML files')"

      - name: Setup .NET 10 SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.401'

      - name: Install Inno Setup 6
        shell: pwsh
        run: choco install innosetup -y --no-progress

      - name: Build Geek POS v3.1.1
        shell: pwsh
        working-directory: source
        run: |
          Set-ExecutionPolicy -Scope Process Bypass -Force
          .\build.ps1

      - name: Stage v3.1.1 setup
        shell: pwsh
        run: |
          $src = "$env:GITHUB_WORKSPACE\source\artifacts\installer-fixed\GeekPOS-Setup-x64-v3.1.1.exe"
          if (!(Test-Path $src)) { throw "v3.1.1 Setup missing." }
          $dst = "$env:GITHUB_WORKSPACE\GeekPOS-Setup-x64-v3.1.1.exe"
          Copy-Item $src $dst -Force
          Write-Host "Setup SHA256: $((Get-FileHash $dst -Algorithm SHA256).Hash)"

      - name: Upload v3.1.1 setup
        uses: actions/upload-artifact@v4
        with:
          name: GeekPOS-Setup-x64-v3.1.1
          path: GeekPOS-Setup-x64-v3.1.1.exe
          if-no-files-found: error
          compression-level: 0
          retention-days: 14

      - name: Upload v3.1.1 source
        uses: actions/upload-artifact@v4
        with:
          name: GeekPOS-Source-v3.1.1
          path: |
            source/**
            !source/artifacts/**
            !source/bin/**
            !source/obj/**
          if-no-files-found: error
          retention-days: 14
