name: Build Geek POS v3.0.5 Receipt Notes Branding

on:
  push:
    branches: [ v3.0.5-receipt-notes-branding ]
    paths:
      - ".github/workflows/build-v304-printer-routing.yml"
      - "patches/v305_transform.py.gz.b64"
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - name: Checkout v3.0.5 branch
        uses: actions/checkout@v4

      - name: Download verified Geek POS v3.0.4 source
        uses: actions/download-artifact@v4
        with:
          name: GeekPOS-Source-v3.0.4
          path: source
          github-token: ${{ github.token }}
          repository: geekcand/pos
          run-id: 38024736561

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Apply Geek POS v3.0.5 transformation
        shell: pwsh
        run: |
          $b64 = (Get-Content "$env:GITHUB_WORKSPACE\patches\v305_transform.py.gz.b64" -Raw).Trim()
          [IO.File]::WriteAllBytes("$env:GITHUB_WORKSPACE\v305_transform.py.gz", [Convert]::FromBase64String($b64))
          python -c "import gzip,pathlib; p=pathlib.Path(r'$env:GITHUB_WORKSPACE\v305_transform.py.gz'); pathlib.Path(r'$env:GITHUB_WORKSPACE\v305_transform.py').write_bytes(gzip.decompress(p.read_bytes()))"
          python "$env:GITHUB_WORKSPACE\v305_transform.py" "$env:GITHUB_WORKSPACE\source"
          if ($LASTEXITCODE -ne 0) { throw "v3.0.5 transformation failed." }

      - name: Verify Geek POS v3.0.5 requirements
        shell: pwsh
        run: |
          $root = "$env:GITHUB_WORKSPACE\source"
          if (!(Test-Path "$root\GeekPOS.csproj")) { throw "GeekPOS.csproj missing." }
          if (Test-Path "$root\SweetsPOS.csproj") { throw "Old project filename remains." }
          $project = Get-Content "$root\GeekPOS.csproj" -Raw
          $installer = Get-Content "$root\installer.iss" -Raw
          $activation = Get-Content "$root\Pages\ActivationPage.xaml" -Raw
          $pos = Get-Content "$root\Pages\PosPage.xaml.cs" -Raw
          $delivery = Get-Content "$root\Pages\DeliveryPage.xaml.cs" -Raw
          $receipt = Get-Content "$root\Services\ReceiptService.cs" -Raw
          $routing = Get-Content "$root\Services\PrinterRoutingService.cs" -Raw
          $db = Get-Content "$root\Data\DatabaseService.cs" -Raw
          $printers = Get-Content "$root\Pages\PrintersPage.xaml" -Raw
          if ($project -notmatch '<Version>3\.0\.5</Version>' -or $project -notmatch '<AssemblyName>GeekPOS</AssemblyName>') { throw "Project version/branding incorrect." }
          if ($installer -notmatch 'Geek POS Activation' -or $installer -notmatch 'قم بإدخال مفتاح التفعيل الذي تم الحصول عليه أثناء شراء النسخة') { throw "Installer activation copy incorrect." }
          if ($activation -notmatch 'Geek POS Activation') { throw "Activation screen title incorrect." }
          if ($printers -match 'محطة' -or $printers -notmatch 'وجهات طباعة التحضير') { throw "Printer terminology incorrect." }
          if ($db -notmatch 'SaleItems ADD COLUMN Notes' -or $db -notmatch 'RestaurantOrderItems ADD COLUMN Notes') { throw "Item-note migration missing." }
          if ($pos -notmatch 'ItemNote_Click' -or $delivery -notmatch 'ItemNote_Click') { throw "Per-item note UI missing." }
          if ($routing -notmatch 'Notes = item\.Notes' -or $receipt -notmatch 'ملاحظة الصنف') { throw "Item notes are not routed/printed." }
          if ($pos -notmatch 'PrintPendingInternalTicketsAsync') { throw "Automatic internal printing on payment missing." }
          if ($receipt -notmatch 'const string currency="ج\.م"') { throw "Receipt currency suffix incorrect." }
          $buildText = (Get-Content "$root\build.ps1" -Raw) + $project + $installer
          if ($buildText -match 'SweetsPOS|Sweets POS|MakkaPOS|Makka POS|makkapos') { throw "Old branding remains in build files." }

      - name: Parse XAML
        shell: pwsh
        run: |
          python -c "from pathlib import Path; import xml.etree.ElementTree as ET; files=list(Path(r'$env:GITHUB_WORKSPACE\source').rglob('*.xaml')); [ET.parse(p) for p in files]; print(f'Parsed {len(files)} XAML files')"

      - name: Setup .NET 10 SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.401'

      - name: Install Inno Setup 6
        shell: pwsh
        run: choco install innosetup -y --no-progress

      - name: Build Geek POS v3.0.5
        shell: pwsh
        working-directory: source
        run: |
          Set-ExecutionPolicy -Scope Process Bypass -Force
          .\build.ps1

      - name: Stage v3.0.5 setup
        shell: pwsh
        run: |
          $src = "$env:GITHUB_WORKSPACE\source\artifacts\installer-fixed\GeekPOS-Setup-x64-v3.0.5.exe"
          if (!(Test-Path $src)) { throw 'v3.0.4 Setup missing.' }
          $dst = "$env:GITHUB_WORKSPACE\GeekPOS-Setup-x64-v3.0.5.exe"
          Copy-Item $src $dst -Force
          Write-Host "Setup SHA256: $((Get-FileHash $dst -Algorithm SHA256).Hash)"

      - name: Upload v3.0.5 setup
        uses: actions/upload-artifact@v4
        with:
          name: GeekPOS-Setup-x64-v3.0.5
          path: GeekPOS-Setup-x64-v3.0.5.exe
          if-no-files-found: error
          compression-level: 0
          retention-days: 14

      - name: Upload v3.0.5 source
        uses: actions/upload-artifact@v4
        with:
          name: GeekPOS-Source-v3.0.5
          path: |
            source/**
            !source/artifacts/**
            !source/bin/**
            !source/obj/**
          if-no-files-found: error
          retention-days: 14
