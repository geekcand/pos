name: Build Sweets POS Setup

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/windows-build.yml"
      - "source-chunks/**"

permissions:
  contents: read

jobs:
  build-windows-x64:
    name: Build Windows x64 + Setup
    runs-on: windows-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Rebuild source package
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $parts = @(
            "part00.txt","part01.txt","part02.txt","part03.txt","part04.txt",
            "part05a.txt","part05b.txt","part05c.txt",
            "part06a.txt","part06b.txt","part06c.txt",
            "part07a.txt","part07b.txt","part07c.txt",
            "part08a.txt","part08b.txt","part08c.txt",
            "part09a.txt","part09b1.txt","part09b2.txt","part09c.txt"
          )

          $encoded = ""
          foreach ($part in $parts) {
            $path = Join-Path $PWD "source-chunks\$part"
            if (!(Test-Path $path)) { throw "Missing source chunk: $part" }
            $encoded += (Get-Content -LiteralPath $path -Raw).Trim()
          }

          if ($encoded.Length -ne 95500) {
            throw "Unexpected encoded source length: $($encoded.Length); expected 95500"
          }

          $zipPath = Join-Path $PWD "SweetsPOS-GitHub-AutoBuild.zip"
          [IO.File]::WriteAllBytes($zipPath, [Convert]::FromBase64String($encoded))

          $hash = (Get-FileHash -Algorithm SHA256 $zipPath).Hash.ToLowerInvariant()
          if ($hash -ne "d198e7f5fedbf24a99e3e0ab53707fe4a68bf8d48d36e3dddd61f202bf2ed3aa") {
            throw "Source package checksum mismatch: $hash"
          }

          $dest = Join-Path $PWD "src"
          New-Item -ItemType Directory -Force -Path $dest | Out-Null
          Expand-Archive -LiteralPath $zipPath -DestinationPath $dest -Force

          if (!(Test-Path (Join-Path $dest "SweetsPOS.csproj"))) {
            throw "Source extraction failed: SweetsPOS.csproj not found."
          }
          Write-Host "Source package verified and extracted."

      - name: Setup .NET 10 SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.401"

      - name: Show .NET info
        shell: pwsh
        run: dotnet --info

      - name: Install Inno Setup 6
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          choco install innosetup -y --no-progress
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          if (!(Test-Path $iscc)) {
            throw "Inno Setup compiler was not found at $iscc"
          }
          Write-Host "Inno Setup ready: $iscc"

      - name: Build app and Setup.exe
        shell: pwsh
        working-directory: src
        run: |
          $ErrorActionPreference = "Stop"
          Set-ExecutionPolicy -Scope Process Bypass -Force
          .\build.ps1

      - name: Verify build outputs
        shell: pwsh
        working-directory: src
        run: |
          $ErrorActionPreference = "Stop"
          $app = Join-Path $PWD "artifacts\final-win-x64\App.exe"
          $setup = Join-Path $PWD "artifacts\installer-fixed\SweetsPOS-Setup-x64.exe"

          if (!(Test-Path $app)) { throw "App.exe was not created: $app" }
          if (!(Test-Path $setup)) { throw "Setup.exe was not created: $setup" }

          Get-Item $app, $setup | Select-Object FullName, Length, LastWriteTime

      - name: Upload Setup
        uses: actions/upload-artifact@v4
        with:
          name: SweetsPOS-Setup-x64
          path: src/artifacts/installer-fixed/SweetsPOS-Setup-x64.exe
          if-no-files-found: error
          compression-level: 0
          retention-days: 14

      - name: Upload portable application
        uses: actions/upload-artifact@v4
        with:
          name: SweetsPOS-Portable-win-x64
          path: src/artifacts/final-win-x64/**
          if-no-files-found: error
          retention-days: 14
